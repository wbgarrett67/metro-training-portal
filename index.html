<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Insurance — Training Portal</title>
<style>
:root{
  /* brand navy sampled straight from the Metro Insurance logo artwork */
  --navy:#1F204F; --navy-2:#2A2B66; --navy-3:#3B3D80;
  --gold:#c8952b; --gold-soft:#f3e2bd; --gold-deep:#7a5710;
  --bg:#f5f6fa; --card:#ffffff; --line:#e3e5ee; --line-2:#c8cbdb;
  --ink:#16182e; --ink-2:#4a4e66; --ink-3:#7c80a1;
  --ok:#1a7f52; --ok-bg:#e6f5ee; --warn:#b0700d; --warn-bg:#fdf3e0;
  --bad:#b3261e; --bad-bg:#fdecea; --info:#3B3D80; --info-bg:#ecedf7;
  --r:12px; --shadow:0 1px 2px rgba(20,22,54,.06),0 8px 24px rgba(20,22,54,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:650;letter-spacing:-.01em}
a{color:var(--navy-3)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none !important}

/* ---------- shell ---------- */
.topbar{background:var(--navy);color:#fff;padding:0 22px;position:sticky;top:0;z-index:40;
  box-shadow:0 2px 12px rgba(15,16,45,.2)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .logo{--logo-1:#fff;--logo-2:#fff;--logo-3:#fff;width:116px;height:35px;flex:none;display:block}
.brand .rule{width:1px;height:26px;background:rgba(255,255,255,.24);flex:none}
.brand .prog{font-size:13.5px;font-weight:600;color:#d3d5ea;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:#c3c6e0}
.who b{color:#fff;font-weight:600}
.btn-ghost{color:#c3c6e0;border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:8px;font-size:13px}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 80px}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1100px 600px at 50% -12%,#3a3c80 0%,var(--navy) 55%,#0d0e26 100%)}
.login-card{width:100%;max-width:440px;background:#fff;border-radius:18px;padding:34px 32px;
  box-shadow:0 24px 70px rgba(8,9,26,.45)}
.login-card .logo{width:206px;height:62px;display:block;margin:0 0 20px -4px}
.login-card h1{font-size:21px}
.login-card p.sub{color:var(--ink-2);font-size:14px;margin:8px 0 22px}
label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
input[type=text],input[type=email],input[type=date],textarea,select{
  width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:9px;font:inherit;
  background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--navy-3);outline-offset:1px;border-color:transparent}
.btn{background:var(--navy);color:#fff;padding:11px 18px;border-radius:9px;font-weight:600;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:hover{background:var(--navy-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.wide{width:100%}
.btn.gold{background:var(--gold);color:#1b1405}.btn.gold:hover{background:#b6851f}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:8px}
.btn.line{background:#fff;color:var(--navy);border:1px solid var(--line-2)}
.btn.line:hover{background:#f1f3f8}
.err{background:var(--bad-bg);color:var(--bad);border:1px solid #f3c9c5;padding:10px 13px;
  border-radius:9px;font-size:13.5px;margin-bottom:16px}
.login-hint{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* ---------- shared bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink-3)}

.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 100%);color:#fff;
  border-radius:16px;padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero h1{font-size:23px;margin-bottom:6px}
.hero p{margin:0;color:#c3c6e0;font-size:14px}
.hero-row{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.hero-row>div:first-child{flex:1;min-width:230px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:23px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1}
.ring .lbl span{font-size:10.5px;color:#b2b5d4;text-transform:uppercase;letter-spacing:.07em}

.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-3),var(--gold));border-radius:99px;
  transition:width .5s ease}
.bar.on-dark{background:rgba(255,255,255,.2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px;
  border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.prog{background:var(--warn-bg);color:var(--warn)}
.pill.todo{background:#eef0f6;color:var(--ink-3)}
.pill.score{background:var(--info-bg);color:var(--info)}
.pill.fail{background:var(--bad-bg);color:var(--bad)}
.pill.sign{background:var(--gold-soft);color:var(--gold-deep)}
.pill.ext{background:#ecedf7;color:var(--navy-3)}
.pill.req{background:#eef0f6;color:var(--ink-3);text-transform:uppercase;font-size:10px;letter-spacing:.06em}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 13px}
.section-h h2{font-size:17px}
.section-h .note{font-size:13px;color:var(--ink-3)}

/* ---------- certification cards ---------- */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.cert{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.cert:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-2)}
.cert.earned:before{background:var(--gold)}
.cert.expired:before{background:var(--bad)}
.cert .seal{font-size:17px;line-height:1}
.cert .cn{font-size:13.5px;font-weight:650;margin:7px 0 3px}
.cert .cm{font-size:12px;color:var(--ink-3)}
.cert .cnum{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-3);margin-top:6px}
.cert .cbtn{margin-top:10px}

/* ---------- tracks ---------- */
.track{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
  box-shadow:var(--shadow);overflow:hidden}
.track-head{display:flex;gap:15px;padding:17px 20px;align-items:center;width:100%;text-align:left}
.track-head:hover{background:#fafbfd}
.track-head .tk{flex:1;min-width:0}
.track-head h3{font-size:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.track-head .tl{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.track-prog{display:flex;align-items:center;gap:11px;flex:none;width:180px}
.track-prog b{font-size:13px;width:38px;text-align:right}
.track-body{border-top:1px solid var(--line);padding:14px 16px 16px;background:#fafbfd}
@media(max-width:640px){ .track-prog{width:120px} }

/* ---------- modules ---------- */
.mod{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden}
.mod:last-child{margin-bottom:0}
.mod.is-done{border-color:#bfe3d1}
.mod-head{display:flex;gap:13px;padding:14px 16px;align-items:flex-start;cursor:pointer;width:100%;text-align:left}
.mod-head:hover{background:#fafbfd}
.num{width:28px;height:28px;border-radius:8px;background:#eef0f7;color:var(--navy-3);display:grid;
  place-items:center;font-weight:700;font-size:13px;flex:none;margin-top:1px}
.mod.is-done .num{background:var(--ok-bg);color:var(--ok)}
.mod-head .txt{flex:1;min-width:0}
.mod-head h4{font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:650}
.mod-head .sub{color:var(--ink-2);font-size:13px;margin-top:3px}
.mod-head .meta{color:var(--ink-3);font-size:11.5px;margin-top:5px;display:flex;gap:11px;flex-wrap:wrap}
.chev{color:var(--ink-3);font-size:11px;margin-top:5px;flex:none;transition:transform .2s}
.mod.open .chev{transform:rotate(180deg)}
.mod-body{border-top:1px solid var(--line);padding:16px 18px 18px;background:#fbfcfe}
.mod-body .ov{color:var(--ink-2);font-size:13.5px;margin:0 0 14px}
.items{list-style:none;padding:0;margin:0 0 16px}
.items li{display:flex;gap:11px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.items li:last-child{border-bottom:0}
.ico{width:19px;height:19px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;margin-top:2px}
.ico.point{background:var(--info-bg);color:var(--navy-3)}
.ico.doc{background:var(--gold-soft);color:var(--gold-deep)}
.ico.task{background:var(--ok-bg);color:var(--ok)}
.items .l{font-weight:600;font-size:13.5px}
.items .d{color:var(--ink-2);font-size:13px;margin-top:2px}
.items .d mark{background:#fdf3e0;color:var(--warn);padding:1px 5px;border-radius:4px;font-weight:650}
.items a.docl{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;
  text-decoration:none;border-bottom:1px solid var(--line-2)}
.items a.docl:hover{border-color:var(--navy-3)}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding-top:2px}
.extbox{background:var(--info-bg);border:1px solid #d5d8ee;border-radius:10px;padding:13px 15px;margin-bottom:14px}
.extbox .et{font-weight:650;font-size:13.5px;margin-bottom:3px}
.extbox .ed{font-size:13px;color:var(--ink-2)}

/* ---------- modal / quiz ---------- */
.ov-back{position:fixed;inset:0;background:rgba(10,11,30,.62);z-index:60;display:grid;
  place-items:start center;padding:34px 18px;overflow:auto}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:720px;box-shadow:0 30px 80px rgba(6,8,24,.5)}
.sheet.wide{max-width:900px}
.sheet-h{display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.sheet-h h3{font-size:17px;flex:1}
.sheet-b{padding:22px 24px}
.sheet-f{padding:16px 24px 22px;border-top:1px solid var(--line);display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);font-size:19px}
.x:hover{background:#f1f3f8;color:var(--ink)}
.q{padding:17px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q .qp{font-weight:620;font-size:14.5px;margin-bottom:11px;display:flex;gap:9px}
.q .qp i{color:var(--ink-3);font-style:normal;font-weight:700;flex:none}
.opt{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  margin-bottom:7px;cursor:pointer;font-size:14px;align-items:flex-start;background:#fff}
.opt:hover{border-color:var(--navy-3);background:#f8f9fc}
.opt input{margin-top:3px;accent-color:var(--navy-3);flex:none}
.opt.correct{border-color:#8fd0ae;background:var(--ok-bg)}
.opt.wrong{border-color:#efb5b0;background:var(--bad-bg)}
.expl{font-size:13px;color:var(--ink-2);background:#f1f3f8;border-left:3px solid var(--navy-3);
  padding:9px 12px;border-radius:0 8px 8px 0;margin-top:9px}
.result{text-align:center;padding:8px 0 20px}
.result .big{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
.result .msg{margin-top:8px;font-size:14.5px;color:var(--ink-2)}
.result.pass .big{color:var(--ok)} .result.fail .big{color:var(--bad)}

/* ---------- certificate ---------- */
.certdoc{border:2px solid var(--navy);border-radius:6px;padding:38px 44px;text-align:center;
  background:#fff;position:relative}
.certdoc:after{content:"";position:absolute;inset:9px;border:1px solid var(--gold);border-radius:3px;
  pointer-events:none}
.certdoc .logo{width:230px;height:70px;margin:0 auto 22px;display:block}
.certdoc .ct{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
.certdoc .cwho{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:16px 0 6px;color:var(--navy)}
.certdoc .cfor{font-size:14px;color:var(--ink-2);margin-bottom:18px}
.certdoc .cname{font-size:21px;font-weight:700;color:var(--navy);margin-bottom:6px}
.certdoc .cmeta{font-size:13px;color:var(--ink-2)}
.certdoc .crule{height:1px;background:var(--line);margin:24px 0 18px}
.certdoc .cfoot{display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--ink-3);
  text-align:left;flex-wrap:wrap}
.certdoc .cfoot b{display:block;color:var(--ink);font-size:13px;font-weight:650}

/* ---------- manager ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 15px;font-size:14px;font-weight:600;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  font-weight:650;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:#f8f9fc}
.tname{font-weight:640}
.tsub{font-size:12.5px;color:var(--ink-3)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:#eef0f7;
  padding:3px 8px;border-radius:6px;color:var(--navy)}
.mini-bar{width:112px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;background:#eef0f6;color:var(--ink-3)}
.chip.gold{background:var(--gold-soft);color:var(--gold-deep)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.mcell{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff}
.mcell .mt{font-size:13.5px;font-weight:620;margin-bottom:7px}
.mcell .mr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3);font-size:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:90;
  box-shadow:0 12px 34px rgba(6,8,24,.42);opacity:0;transition:.28s;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
/* these are <label> elements, so undo the global form-label typography */
.tgl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer;
  text-transform:none;letter-spacing:normal;font-size:15px;font-weight:400;color:var(--ink)}
.tgl:hover{border-color:var(--navy-3);background:#fafbfd}
.tgl input{accent-color:var(--navy-3);width:16px;height:16px;flex:none}
.tgl .tn{font-weight:620;font-size:14px}
.tgl .td{font-size:12.5px;color:var(--ink-3)}
.trackgrp{margin-bottom:22px}
.trackgrp>h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:9px}

@media(max-width:640px){
  .form-row{grid-template-columns:1fr}
  .hide-sm{display:none}
  .wrap{padding:18px 14px 60px}
  .hero{padding:20px}
  .topbar{padding:0 14px}
  .brand .rule,.brand .prog{display:none}
  .brand .logo{width:104px;height:31px}
  .who,.btn-ghost{white-space:nowrap}
  .who{font-size:12.5px}
  .btn-ghost{padding:6px 10px}
  .track-head{flex-wrap:wrap}
  .certdoc{padding:24px 20px}
  .certdoc .cwho{font-size:24px}
}

/* ---------- print: certificate only ---------- */
@media print{
  body{background:#fff}
  body>*{display:none !important}
  #modal{display:block !important;position:static;padding:0;background:none;overflow:visible}
  #modal .sheet{box-shadow:none;max-width:none;border-radius:0}
  #modal .sheet-h,#modal .sheet-f{display:none !important}
  #modal .sheet-b{padding:0}
  .certdoc{border-width:3px}
  @page{size:landscape;margin:12mm}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="view-login" class="login-wrap">
  <div class="login-card">
    <svg class="logo" role="img" aria-label="Metro Insurance"><use href="#mia-logo"/></svg>
    <h1>Training Portal</h1>
    <p class="sub">Metro Insurance Agencies, LLC — enter your access code to open your training and certifications.</p>
    <div id="loginErr" class="err hidden"></div>
    <form id="loginForm">
      <label for="code">Access code</label>
      <input id="code" type="text" placeholder="MIA-XXXXXX" autocomplete="off" spellcheck="false" required>
      <div style="height:16px"></div>
      <button class="btn wide" type="submit" id="loginBtn">Open my training</button>
    </form>
    <div class="login-hint">
      Your Senior Manager issues your access code. Progress and certifications save automatically
      and are visible to management as you go.
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="view-app" class="hidden">
  <div class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <svg class="logo" role="img" aria-label="Metro Insurance"><use href="#mia-logo"/></svg>
        <div class="rule"></div>
        <div class="prog">Training Portal</div>
      </div>
      <div class="spacer"></div>
      <div class="who"><span class="hide-sm">Signed in as</span> <b id="whoName"></b></div>
      <button class="btn-ghost hidden" id="modeToggle"></button>
      <button class="btn-ghost" id="signOut">Sign out</button>
    </div>
  </div>
  <div class="wrap">
    <div id="paneTrainee" class="hidden"></div>
    <div id="paneManager" class="hidden"></div>
  </div>
</div>

<!-- Metro Insurance logo, vectorised from the supplied .eps. Colours are driven by
     --logo-1 (Metro wordmark), --logo-2 (INSURANCE), --logo-3 (swoosh) so the same

<div id="modal" class="ov-back hidden"></div>
<div id="toast" class="toast"></div>

<script>
/* ================= config ================= */
const SUPABASE_URL = "https://rpxspsmsvkosdaxabhxj.supabase.co";
const SUPABASE_KEY = "sb_publishable_NoJmcZHNCtjjkrBlHNJL3w__X_lSAPv";

/* ================= state ================= */
let CODE=null, ME=null, STATE=null, MGR=null, CAT=null, CE=null, EMAILST=null, lastAdded=null,
    PREVIEW=null, MODE=null,
    selCE=null,
    openMods=new Set(), openTracks=null, mgrTab="roster", selTrainee=null,
    openCat=new Set(), draft=null;

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// authored review flags like [NEEDS REVIEW — ...] get highlighted rather than hidden
const flag = s => esc(s).replace(/\[(NEEDS REVIEW|VERIFY)([^\]]*)\]/g,
  (m,a,b)=>`<mark>${a}${esc0(b)}</mark>`);
const esc0 = s => String(s ?? "");

async function rpc(fn, params){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{ "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}`,
              "Content-Type":"application/json" },
    body: JSON.stringify(params||{})
  });
  const txt = await r.text();
  let data=null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
  if(!r.ok){
    const m = (data && (data.message||data.hint)) || "Request failed";
    throw new Error(
      /INVALID_CODE/.test(m) ? "That access code was not recognized." :
      /NOT_MANAGER/.test(m)  ? "That code does not have manager access." :
      /TRACK_IS_REQUIRED_FOR_ALL/.test(m) ? "That track is required for everyone and cannot be removed." :
      /NO_CERT/.test(m) ? "No certification on file for that track yet." : m);
  }
  return data;
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600);
}
function when(ts){
  if(!ts) return "—";
  const d=new Date(ts), diff=(new Date()-d)/1000;
  if(diff<60) return "just now";
  if(diff<3600) return Math.floor(diff/60)+" min ago";
  if(diff<86400) return Math.floor(diff/3600)+" hr ago";
  if(diff<604800) return Math.floor(diff/86400)+"d ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function fdate(s){
  if(!s) return "—";
  const d = s.length<=10 ? new Date(s+"T12:00:00") : new Date(s);
  return d.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
}
function sdate(s){
  if(!s) return "—";
  const d = s.length<=10 ? new Date(s+"T12:00:00") : new Date(s);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function ring(pct){
  const R=44, C=2*Math.PI*R, off=C*(1-pct/100);
  return `<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104">
      <circle cx="52" cy="52" r="${R}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="9"/>
      <circle cx="52" cy="52" r="${R}" fill="none" stroke="#c8952b" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
    <div class="lbl"><div><b>${pct}%</b><span>Complete</span></div></div></div>`;
}
const statusPill = s => s==="completed" ? '<span class="pill done">✓ Complete</span>'
  : s==="in_progress" ? '<span class="pill prog">● In progress</span>'
  : '<span class="pill todo">Not started</span>';
const pct = (d,t) => t ? Math.round(d*100/t) : 0;

// What to call someone. An explicit "goes by" wins; otherwise take the first name that is a
// name rather than an initial, so "W. Braden Garrett" greets as Braden, not W.
function firstName(person){
  if(!person) return "";
  const pref = (person.preferred_name||"").trim();
  if(pref) return pref;
  const parts = String(person.full_name||"").trim().split(/\s+/);
  const real = parts.find(x=>!/^[A-Za-z]\.?$/.test(x));
  return real || parts[0] || "";
}

/* ================= auth ================= */
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("#loginBtn"), err=$("#loginErr");
  const code=$("#code").value.trim().toUpperCase();
  if(!code) return;
  btn.disabled=true; btn.textContent="Checking…"; err.classList.add("hidden");
  try{
    ME = await rpc("training_login",{p_code:code}); CODE=code;
    location.hash = "#c="+encodeURIComponent(code);
    await boot();
  }catch(ex){ err.textContent=ex.message; err.classList.remove("hidden"); }
  finally{ btn.disabled=false; btn.textContent="Open my training"; }
});
$("#signOut").addEventListener("click", ()=>{
  if(PREVIEW){ exitPreview(); return; }
  CODE=ME=STATE=MGR=null; selTrainee=null; lastAdded=null; MODE=null;
  openMods.clear(); openTracks=null; location.hash="";
  $("#modeToggle").classList.add("hidden");
  $("#view-app").classList.add("hidden");
  $("#view-login").classList.remove("hidden");
  $("#code").value="";
});
// Managers and owners are agents too. They get both halves of the portal and a header
// toggle between them, rather than being locked into one. Everyone else only ever has
// their own training, so no toggle is shown.
const isStaff = r => r === "manager" || r === "owner";

async function boot(){
  $("#view-login").classList.add("hidden");
  $("#view-app").classList.remove("hidden");
  $("#whoName").textContent = ME.full_name;
  const staff = isStaff(ME.role);
  $("#modeToggle").classList.toggle("hidden", !staff);
  // Staff land on the dashboard because that is the job they logged in to do;
  // their own training is one click away.
  await setMode(staff ? "manager" : "training");
}

// The single place that decides which half of the portal is on screen. Switching into
// "training" always refetches, so nothing left over from a preview can leak into a
// manager's real record.
async function setMode(mode){
  MODE = mode;
  PREVIEW = null;
  if(mode === "manager"){
    $("#paneTrainee").classList.add("hidden");
    $("#paneManager").classList.remove("hidden");
    $("#modeToggle").textContent = "My training";
    await loadManager();
  }else{
    $("#paneManager").classList.add("hidden");
    $("#paneTrainee").classList.remove("hidden");
    $("#modeToggle").textContent = isStaff(ME.role) ? "Manager dashboard" : "";
    STATE = null; openTracks = null; openMods.clear();
    await loadTrainee();
  }
  window.scrollTo(0,0);
}

$("#modeToggle").addEventListener("click", async ()=>{
  const btn = $("#modeToggle");
  btn.disabled = true;
  try{ await setMode(MODE === "manager" ? "training" : "manager"); }
  finally{ btn.disabled = false; }
});

/* ================= trainee ================= */
async function loadTrainee(){
  STATE = await rpc("training_state",{p_code:CODE});
  if(openTracks === null){
    // first load: open whatever still needs work, so nobody has to hunt for it
    openTracks = new Set();
    for(const t of STATE.tracks){
      const done = t.modules.filter(m=>m.status==="completed").length;
      if(done < t.modules.length) openTracks.add(t.slug);
    }
    if(!openTracks.size && STATE.tracks[0]) openTracks.add(STATE.tracks[0].slug);
  }
  renderTrainee();
}

function renderTrainee(){
  const tracks = STATE.tracks || [];
  const all = tracks.flatMap(t=>t.modules);
  const done = all.filter(m=>m.status==="completed").length;
  const overall = pct(done, all.length);
  const earned = tracks.filter(t=>t.certification && !t.certification.expired).length;
  // an expired certification is the loudest signal here, so count it alongside near-expiry
  const recertDue = tracks.filter(t=>t.certification && (t.certification.expired
      || (t.certification.days_left !== null && t.certification.days_left <= 45))).length;
  const mins = all.filter(m=>m.status!=="completed").reduce((a,m)=>a+(m.estimated_minutes||0),0);
  const notices = STATE.notices || [];
  const unread = notices.filter(n=>!n.is_read).length;
  const mgr = STATE.manager;
  const next = all.find(m=>m.status!=="completed");

  $("#paneTrainee").innerHTML = `
    <div class="hero">
      <div class="hero-row">
        <div>
          <h1>${PREVIEW ? "Agent view" : "Welcome, "+esc(firstName(ME))}</h1>
          <p>${done===all.length && all.length
              ? "Every module in your assigned training is complete."
              : `Next up: <b style="color:#fff">${esc(next?next.title:"—")}</b>`}</p>
          <p style="margin-top:10px;font-size:13px;color:#b2b5d4">
            ${ME.location?esc(ME.location)+" · ":""}Start date ${sdate(ME.start_date)}
            ${mgr?` · ${mgr.role==="owner"?"Agency Owner":"Senior Manager"}: `+esc(mgr.full_name):""}
          </p>
        </div>
        ${ring(overall)}
      </div>
    </div>

    <div class="grid-stats">
      <div class="stat"><div class="k">Modules complete</div><div class="v">${done}<small> / ${all.length}</small></div></div>
      <div class="stat"><div class="k">Certifications held</div><div class="v">${earned}<small> / ${tracks.length}</small></div></div>
      <div class="stat"><div class="k">Recertification due</div><div class="v" style="${recertDue?'color:var(--warn)':''}">${recertDue}</div></div>
      <div class="stat"><div class="k">Est. time remaining</div><div class="v">${Math.round(mins/60*10)/10}<small> hrs</small></div></div>
    </div>

    ${previewBanner()}
    ${ceBanner()}

    <div class="section-h"><h2>My certifications</h2>
      <span class="note">Complete every module in a track to earn its certification.</span></div>
    <div class="certs">${tracks.map(certCard).join("")}</div>

    <div class="section-h">
      <h2>Progress updates</h2>
      ${unread?`<button class="btn line sm" id="markRead">Mark all read</button>`:`<span class="note">No new updates</span>`}
    </div>
    <div class="card">
      ${notices.length ? notices.slice(0,6).map(n=>`
        <div class="notice ${n.is_read?"read":""}" style="display:flex;gap:12px;padding:13px 16px;
             border-bottom:1px solid var(--line);align-items:flex-start">
          <div style="width:8px;height:8px;border-radius:99px;margin-top:7px;flex:none;
               background:${n.is_read?"var(--line-2)":"var(--gold)"}"></div>
          <div style="flex:1">
            <div style="font-weight:620;font-size:14px">${esc(n.title)}</div>
            ${n.body?`<div style="color:var(--ink-2);font-size:13.5px;margin-top:2px">${esc(n.body)}</div>`:""}
            <div style="font-size:11.5px;color:var(--ink-3);margin-top:4px">${when(n.created_at)}</div>
          </div>
        </div>`).join("")
        : `<div class="empty">Your progress updates will appear here as you complete modules and quizzes.</div>`}
    </div>

    <div class="section-h"><h2>Training tracks</h2>
      <span class="note">Read the material, then pass the quiz at 80% to complete a module.</span></div>
    <div id="trackList">${tracks.map(trackCard).join("")}</div>`;

  if(unread) $("#markRead").addEventListener("click", async ()=>{
    await rpc("training_notices_read",{p_code:CODE,p_audience:"trainee"});
    await loadTrainee(); toast("Updates marked read");
  });
  wireTrainee();
}

function certCard(t){
  const c = t.certification;
  const done = t.modules.filter(m=>m.status==="completed").length;
  const cls = !c ? "" : (c.expired ? "expired" : "earned");
  return `<div class="cert ${cls}">
    <div class="seal">${!c?"○":(c.expired?"⚠":"★")}</div>
    <div class="cn">${esc(t.cert_name)}</div>
    ${c ? `<div class="cm">${c.expired
              ? `Expired ${sdate(c.expires_at)}`
              : `Earned ${sdate(c.earned_at)}${c.expires_at?` · expires ${sdate(c.expires_at)}`:""}`}</div>
           <div class="cnum">${esc(c.cert_number)}</div>
           <div class="cbtn"><button class="btn line sm" data-cert="${esc(t.slug)}">View certificate</button></div>`
        : `<div class="cm">${done} of ${t.modules.length} modules complete</div>
           <div class="bar" style="margin-top:9px"><i style="width:${pct(done,t.modules.length)}%"></i></div>`}
  </div>`;
}

function trackCard(t){
  const open = openTracks.has(t.slug);
  const done = t.modules.filter(m=>m.status==="completed").length;
  const p = pct(done, t.modules.length);
  const c = t.certification;
  return `<div class="track">
    <button class="track-head" data-track="${esc(t.slug)}">
      <div class="tk">
        <h3>${esc(t.name)}
          <span class="pill req">${esc(AUD[t.audience]||t.audience)}</span>
          ${c && !c.expired ? `<span class="pill sign">★ Certified</span>`:""}
          ${c && c.expired ? `<span class="pill fail">Expired</span>`:""}
        </h3>
        <div class="tl">${esc(t.tagline||"")}</div>
      </div>
      <div class="track-prog">
        <div class="bar" style="flex:1"><i style="width:${p}%"></i></div><b>${p}%</b>
      </div>
      <div class="chev">▼</div>
    </button>
    ${open?`<div class="track-body">${t.modules.map((m,i)=>modCard(m,i)).join("")}</div>`:""}
  </div>`;
}

function modCard(m,i){
  const open = openMods.has(m.slug);
  const ba = m.best_attempt;
  const ext = m.format === "external";
  return `<div class="mod ${m.status==="completed"?"is-done":""} ${open?"open":""}">
    <button class="mod-head" data-toggle="${esc(m.slug)}">
      <div class="num">${m.status==="completed"?"✓":i+1}</div>
      <div class="txt">
        <h4>${esc(m.title)} ${statusPill(m.status)}
          ${ext?`<span class="pill ext">External ↗</span>`:""}
          ${ba?`<span class="pill ${ba.passed?"score":"fail"}">Quiz ${ba.score_pct}%</span>`:""}
          ${m.signoff?`<span class="pill sign">★ Signed off</span>`:""}
        </h4>
        <div class="sub">${esc(m.subtitle||"")}</div>
        <div class="meta">
          <span>≈ ${m.estimated_minutes} min</span>
          <span>${(m.items||[]).length} key points</span>
          ${m.quiz?`<span>${m.quiz.question_count}-question quiz · pass ${m.quiz.pass_pct}%</span>`:""}
          ${m.completed_at?`<span>Completed ${when(m.completed_at)}</span>`:""}
        </div>
      </div>
      <div class="chev">▼</div>
    </button>
    ${open?`<div class="mod-body">
      ${m.overview?`<p class="ov">${esc(m.overview)}</p>`:""}
      ${ext?`<div class="extbox">
          <div class="et">This training is hosted outside the portal</div>
          <div class="ed">${m.external_provider?esc(m.external_provider)+". ":""}Open it, complete it,
            then confirm below so it counts toward your certification.</div>
          ${m.external_url?`<div style="margin-top:10px">
            <a class="btn gold sm" href="${esc(m.external_url)}" target="_blank" rel="noopener"
               style="text-decoration:none">Open the training ↗</a></div>`:""}
        </div>`:""}
      <ul class="items">
        ${(m.items||[]).map(it=>`<li>
            <div class="ico ${it.kind}">${it.kind==="doc"?"📄":it.kind==="task"?"✓":"•"}</div>
            <div style="flex:1">
              ${it.url?`<a class="docl" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.label)} ↗</a>`
                      :`<div class="l">${esc(it.label)}</div>`}
              ${it.detail?`<div class="d">${flag(it.detail)}</div>`:""}
            </div></li>`).join("")}
      </ul>
      ${m.signoff?`<div class="expl" style="margin-bottom:14px">
          <b>Signed off by ${esc(m.signoff.manager_name||"your Senior Manager")}</b> — ${when(m.signoff.signed_at)}

        ${m.quiz?`<button class="btn gold sm" data-quiz="${esc(m.slug)}">
            ${ba&&ba.passed?"Retake quiz":"Take the quiz"}</button>`:""}
        ${ext && m.status!=="completed"
          ? `<button class="btn sm" data-attest="${esc(m.slug)}">I completed this training</button>`:""}
        ${m.status!=="completed"
          ? `<button class="btn line sm" data-status="in_progress" data-slug="${esc(m.slug)}">Mark in progress</button>
             ${!m.quiz && !ext?`<button class="btn sm" data-status="completed" data-slug="${esc(m.slug)}">Mark complete</button>`:""}`
          : `<button class="btn line sm" data-status="in_progress" data-slug="${esc(m.slug)}">Reopen</button>`}
      </div>
    </div>`:""}
  </div>`;
}

function wireTrainee(){
  const root = $("#paneTrainee");
  if(PREVIEW){
    // reading only: keep the expand/collapse, disable everything that would write
    root.querySelectorAll("[data-track]").forEach(b=>b.addEventListener("click",()=>{
      const s=b.dataset.track; openTracks.has(s)?openTracks.delete(s):openTracks.add(s); renderTrainee();
    }));
    root.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation();
      const s=b.dataset.toggle; openMods.has(s)?openMods.delete(s):openMods.add(s); renderTrainee();
    }));
    root.querySelectorAll("[data-status],[data-attest],[data-quiz],[data-cert]").forEach(b=>{
      b.disabled = true; b.title = "Disabled while previewing";
      b.style.opacity = ".5"; b.style.cursor = "not-allowed";
    });
    const sw = root.querySelector("#pvSwap"), ex = root.querySelector("#pvExit");
    if(sw) sw.addEventListener("click", ()=>startPreview(
      PREVIEW.license === "licensed" ? "unlicensed" : "licensed"));
    if(ex) ex.addEventListener("click", exitPreview);
    return;
  }
  root.querySelectorAll("[data-track]").forEach(b=>b.addEventListener("click",()=>{
    const s=b.dataset.track; openTracks.has(s)?openTracks.delete(s):openTracks.add(s); renderTrainee();
  }));
  root.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    const s=b.dataset.toggle; openMods.has(s)?openMods.delete(s):openMods.add(s); renderTrainee();
  }));
  root.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation(); b.disabled=true;
    const r=await rpc("training_set_module_status",
      {p_code:CODE,p_slug:b.dataset.slug,p_status:b.dataset.status});
    await loadTrainee();
    toast(b.dataset.status==="completed"?`Module complete — ${r.percent}% overall`:"Marked in progress");
  }));
  root.querySelectorAll("[data-attest]").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation(); b.disabled=true;
    await rpc("training_attest",{p_code:CODE,p_slug:b.dataset.attest});
    await loadTrainee(); toast("Recorded — thanks for confirming");
  }));
  root.querySelectorAll("[data-quiz]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); openQuiz(b.dataset.quiz);
  }));
  root.querySelectorAll("[data-cert]").forEach(b=>b.addEventListener("click",()=>
    openCertificate(b.dataset.cert, null)));
}

/* ================= quiz ================= */
async function openQuiz(slug){
  const mod = (STATE.tracks.flatMap(t=>t.modules)).find(m=>m.slug===slug);
  const quiz = await rpc("training_quiz_get",{p_code:CODE,p_slug:slug});
  const answers = {};
  const modal = $("#modal"); modal.classList.remove("hidden");

  const draw = () => {
    modal.innerHTML = `<div class="sheet">
      <div class="sheet-h"><h3>${esc(quiz.title)}</h3><button class="x" id="qClose">×</button></div>
      <div class="sheet-b">
        <p style="margin:0 0 6px;color:var(--ink-2);font-size:14px">
          ${quiz.questions.length} questions · you need ${quiz.pass_pct}% to complete
          <b>${esc(mod.title)}</b>.</p>
        ${quiz.questions.map((q,i)=>`
          <div class="q" data-q="${q.id}">
            <div class="qp"><i>${i+1}.</i><span>${esc(q.prompt)}</span></div>
            ${q.options.map((o,oi)=>`<label class="opt">
                <input type="radio" name="q${q.id}" value="${oi}"><span>${esc(o)}</span></label>`).join("")}
          </div>`).join("")}
      </div>
      <div class="sheet-f">
        <button class="btn" id="qSubmit" disabled>Submit answers</button>
        <span id="qCount" style="font-size:13.5px;color:var(--ink-3)">0 of ${quiz.questions.length} answered</span>
      </div></div>`;
    modal.scrollTop = 0;
    modal.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",()=>{
      answers[r.closest(".q").dataset.q] = Number(r.value);
      const n = Object.keys(answers).length;
      modal.querySelector("#qCount").textContent = `${n} of ${quiz.questions.length} answered`;
      modal.querySelector("#qSubmit").disabled = n < quiz.questions.length;
    }));
    modal.querySelector("#qClose").addEventListener("click", closeModal);
    modal.querySelector("#qSubmit").addEventListener("click", submit);
  };

  async function submit(){
    const btn = modal.querySelector("#qSubmit");
    btn.disabled=true; btn.textContent="Grading…";
    const res = await rpc("training_quiz_submit",{p_code:CODE,p_slug:slug,p_answers:answers});
    modal.innerHTML = `<div class="sheet">
      <div class="sheet-h"><h3>Results — ${esc(mod.title)}</h3><button class="x" id="qClose2">×</button></div>
      <div class="sheet-b">
        <div class="result ${res.passed?"pass":"fail"}">
          <div class="big">${res.score_pct}%</div>
          <div class="msg">${res.correct_count} of ${res.question_count} correct.
            ${res.passed
              ? `You passed — <b>${esc(mod.title)}</b> is complete and your Senior Manager has been notified.`
              : `You need ${res.pass_pct}% to pass. Review the explanations below and try again.`}</div>
        </div>
        ${res.detail.map((d,i)=>`<div class="q">
            <div class="qp"><i>${i+1}.</i><span>${esc(d.prompt)}</span></div>
            ${d.options.map((o,oi)=>{
              const isC=oi===d.correct_index, isS=oi===d.selected;
              return `<div class="opt ${isC?"correct":(isS?"wrong":"")}" style="cursor:default">
                <span style="flex:none;width:16px;font-weight:700">${isC?"✓":(isS?"✕":"")}</span>
                <span>${esc(o)}</span></div>`;}).join("")}
            ${d.explanation?`<div class="expl">${esc(d.explanation)}</div>`:""}
          </div>`).join("")}
      </div>
      <div class="sheet-f">
        <button class="btn" id="qDone">Back to my training</button>
        ${!res.passed?`<button class="btn line" id="qRetry">Try again</button>`:""}
      </div></div>`;
    modal.scrollTop = 0;
    modal.querySelector("#qClose2").addEventListener("click", finish);
    modal.querySelector("#qDone").addEventListener("click", finish);
    const rt = modal.querySelector("#qRetry");
    if(rt) rt.addEventListener("click", ()=>{ for(const k in answers) delete answers[k]; draw(); });
  }
  async function finish(){ closeModal(); await loadTrainee(); }
  draw();
}
function closeModal(){ $("#modal").classList.add("hidden"); $("#modal").innerHTML=""; }

async function loadManager(){

function renderManager(){
  const ts = MGR.trainees||[], tracks = MGR.tracks||[];
  const notices = MGR.notices||[], unread = notices.filter(n=>!n.is_read).length;

  const certs = ts.reduce((a,t)=>a+t.certs.filter(c=>!c.expired).length,0);
  const attention = ts.filter(t=>{
    if(t.certs.some(c=>c.expired || (c.days_left!==null && c.days_left<=45))) return true;
    if(t.completed >= t.total_modules) return false;
    if(!t.last_activity) return true;
    return (Date.now()-new Date(t.last_activity))/86400000 > 7;

  $("#paneManager").innerHTML = `
    <div class="hero">

        <div>

            ${ts.length} agent${ts.length===1?"":"s"} · ${tracks.length} tracks ·
            ${tracks.reduce((a,t)=>a+t.module_count,0)} modules

          </p>

            <button class="btn gold sm" data-preview="licensed">View as a licensed agent</button>
            <button class="btn line sm" data-preview="unlicensed">View as an unlicensed hire</button>
          </div>
        </div>
        ${ring(avg)}
      </div>
    </div>
    <div class="grid-stats">
      <div class="stat"><div class="k">Active agents</div><div class="v">${ts.length}</div></div>
      <div class="stat"><div class="k">Average completion</div><div class="v">${avg}<small>%</small></div></div>
      <div class="stat"><div class="k">Certifications current</div><div class="v">${certs}</div></div>
      <div class="stat"><div class="k">Needs attention</div><div class="v" style="${attention?'color:var(--warn)':''}">${attention}</div></div>
    </div>
    <div class="tabs">
      <button class="tab ${mgrTab==="roster"?"on":""}" data-tab="roster">Roster</button>
      <button class="tab ${mgrTab==="ce"?"on":""}" data-tab="ce">Licensing &amp; CE</button>
      <button class="tab ${mgrTab==="content"?"on":""}" data-tab="content">Content editor</button>
      <button class="tab ${mgrTab==="tracks"?"on":""}" data-tab="tracks">Track catalog</button>
      <button class="tab ${mgrTab==="activity"?"on":""}" data-tab="activity">Activity${unread?` (${unread})`:""}</button>
      <button class="tab ${mgrTab==="add"?"on":""}" data-tab="add">Add an agent</button>
    </div>
    <div id="mgrBody"></div>`;
  $("#paneManager").querySelectorAll("[data-preview]").forEach(b=>b.addEventListener("click",
    ()=>startPreview(b.dataset.preview)));

    mgrTab=b.dataset.tab; selTrainee=null;
    if(mgrTab==="content" && !CAT) await loadCatalog();
    if(mgrTab==="ce" && !CE) await loadCE();
    renderManager();

  ({roster:mgrRoster, ce:mgrCE, content:mgrContent, tracks:mgrTracks,

async function startPreview(license){

}

/* ================= content editor ================= */
async function loadCatalog(){ CAT = await rpc("training_author_catalog",{p_code:CODE}); }

const CATS = {core:"Core", licensing:"Licensing & credentials", skills:"Skills",
              products:"Product knowledge"};
// who a track is for — this is what makes a dual track work
const AUD = {all:"Everyone", unlicensed:"Unlicensed only", licensed:"Licensed only",
             assigned:"Assigned"};
const LIC = {unlicensed:"Unlicensed", in_progress:"Licensing in progress", licensed:"Licensed"};
const CE_STAGE = {
  ok:        {label:"On track",            cls:"todo"},
  due:       {label:"CE due",              cls:"prog"},
  urgent:    {label:"Urgent",              cls:"fail"},
  awaiting_nipr:{label:"Awaiting NIPR filing", cls:"score"},
  lapsed:    {label:"LAPSED",              cls:"fail"},
  complete:  {label:"Renewed",             cls:"done"},
  unknown:   {label:"No licence on file",  cls:"todo"}
};
const draftPill = s => s==="draft" ? `<span class="pill prog">Draft</span>`
                                   : `<span class="pill done">Published</span>`;

function mgrContent(){
  const tracks = (CAT && CAT.tracks) || [];
  $("#mgrBody").innerHTML = `
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
      <button class="btn sm" id="newTrack">+ New category</button>
      <span class="note" style="font-size:13px;color:var(--ink-3)">
        New categories and modules start as <b>Draft</b> — agents cannot see them until you publish.</span>
    </div>
    ${tracks.map(catTrack).join("")}
    <div class="section-h"><h2>Recent content changes</h2></div>
    <div class="card">${(CAT.log||[]).length ? (CAT.log||[]).slice(0,12).map(l=>`
      <div style="display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13.5px">
        <div style="flex:1"><b>${esc(l.actor||"—")}</b> ${esc(l.action)} ${esc(l.kind)}
          ${l.slug?`<span class="code">${esc(l.slug)}</span>`:""}
          ${l.detail?`<span style="color:var(--ink-3)"> — ${esc(l.detail)}</span>`:""}</div>
        <div style="color:var(--ink-3);white-space:nowrap">${when(l.at)}</div>
      </div>`).join("") : `<div class="empty">No content changes recorded yet.</div>`}</div>`;

  $("#newTrack").addEventListener("click", ()=>openTrackEditor(null));
  const body = $("#mgrBody");
  body.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{
    const s=b.dataset.cat; openCat.has(s)?openCat.delete(s):openCat.add(s); mgrContent();
  }));
  body.querySelectorAll("[data-edittrack]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); openTrackEditor(b.dataset.edittrack); }));
  body.querySelectorAll("[data-editmod]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); openModuleEditor(b.dataset.editmod, b.dataset.track); }));
  body.querySelectorAll("[data-newmod]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); openModuleEditor(null, b.dataset.newmod); }));
  body.querySelectorAll("[data-pub]").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation(); b.disabled=true;
    await rpc("training_publish",{p_code:CODE,p_kind:b.dataset.kind,
      p_slug:b.dataset.pub,p_publish:b.dataset.to==="1"});
    await loadCatalog(); mgrContent();
    toast(b.dataset.to==="1"?"Published — agents can see it now":"Moved back to draft");
  }));
  body.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation();
    const list = b.dataset.kind==="track"
      ? tracks.map(t=>t.slug)
      : tracks.find(t=>t.slug===b.dataset.track).modules.map(m=>m.slug);
    const i = list.indexOf(b.dataset.move), j = i + (b.dataset.dir==="up"?-1:1);
    if(j<0 || j>=list.length) return;
    [list[i],list[j]] = [list[j],list[i]];
    await rpc("training_reorder",{p_code:CODE,p_kind:b.dataset.kind,p_slugs:list});
    await loadCatalog(); mgrContent();
  }));
}

  return `<div class="track">
    <button class="track-head" data-cat="${esc(t.slug)}">

        <h3>${esc(t.name)} ${draftPill(t.status)}

          ${drafts?`<span class="pill prog">${drafts} draft module${drafts===1?"":"s"}</span>`:""}</h3>
        <div class="tl">${esc(t.tagline||"")} · ${t.modules.length} modules

    ${open?`<div class="track-body">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
        <button class="btn line sm" data-edittrack="${esc(t.slug)}">Edit category</button>
        <button class="btn line sm" data-newmod="${esc(t.slug)}">+ Add module</button>
        <button class="btn line sm" data-pub="${esc(t.slug)}" data-kind="track"

        <button class="btn line sm" data-move="${esc(t.slug)}" data-kind="track" data-dir="up">↑</button>
        <button class="btn line sm" data-move="${esc(t.slug)}" data-kind="track" data-dir="down">↓</button>
      </div>
      ${t.modules.length ? t.modules.map(m=>`
        <div class="mod"><div class="mod-head" style="cursor:default">
          <div class="num">${m.status==="draft"?"✎":"✓"}</div>
          <div class="txt">
            <h4>${esc(m.title)} ${draftPill(m.status)}
              ${m.format==="external"?`<span class="pill ext">External ↗</span>`:""}</h4>
            <div class="sub">${esc(m.subtitle||"")}</div>
            <div class="meta">
              <span>${(m.items||[]).length} key points</span>
              <span>${m.quiz?(m.quiz.questions||[]).length:0} questions</span>
              <span>${m.completions} completion${m.completions===1?"":"s"}</span>
              <span>${m.attempts} quiz attempt${m.attempts===1?"":"s"}</span>
            </div>
            <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
              <button class="btn line sm" data-editmod="${esc(m.slug)}" data-track="${esc(t.slug)}">Edit content</button>
              <button class="btn line sm" data-pub="${esc(m.slug)}" data-kind="module"
                data-to="${m.status==="published"?"0":"1"}">${m.status==="published"?"Unpublish":"Publish"}</button>
              <button class="btn line sm" data-move="${esc(m.slug)}" data-kind="module"
                data-track="${esc(t.slug)}" data-dir="up">↑</button>
              <button class="btn line sm" data-move="${esc(m.slug)}" data-kind="module"
                data-track="${esc(t.slug)}" data-dir="down">↓</button>
            </div>
          </div></div></div>`).join("")
        : `<div class="empty" style="padding:24px">No modules yet. Use <b>+ Add module</b> to write the first one.</div>`}
    </div>`:""}
  </div>`;
}

      </div>

      <div style="height:14px"></div>
      <label for="fDesc">Description</label>

  modal.querySelector("#tCancel").addEventListener("click", close);

    const sl = modal.querySelector("#fSlug");
    if(!sl.dataset.touched) sl.value = e.target.value.toLowerCase()
      .replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  });
  modal.querySelector("#fSlug").addEventListener("input",e=>e.target.dataset.touched="1");

  modal.querySelector("#tSave").addEventListener("click", async ()=>{
    const b = modal.querySelector("#tSave"); b.disabled=true; b.textContent="Saving…";
    try{
      await rpc("training_save_track",{p_code:CODE, p_slug:slug, p_payload:{
        slug:modal.querySelector("#fSlug").value.trim(),

/* ---------- module editor ---------- */
function openModuleEditor(slug, trackSlug){
  const src = slug ? CAT.tracks.flatMap(t=>t.modules).find(m=>m.slug===slug) : null;
  draft = src ? JSON.parse(JSON.stringify(src)) : {
    slug:"", title:"", subtitle:"", overview:"", estimated_minutes:30, status:"draft",
    format:"internal", external_url:"", external_provider:"", items:[], quiz:null,
    completions:0, attempts:0 };
  draft.track = trackSlug;
  const modal = $("#modal"); modal.classList.remove("hidden");
  drawModuleEditor(slug);
}

  modal.innerHTML = `<div class="sheet wide">
    <div class="sheet-h"><h3>${slug?"Edit module":"New module"}</h3>
      ${d.completions?`<span class="pill score">${d.completions} agent${d.completions===1?"":"s"} completed this</span>`:""}
      <button class="x" id="mClose">×</button></div>
    <div class="sheet-b">
      <div id="mErr" class="err hidden"></div>
      <div class="form-row">
        <div><label for="gTitle">Module title</label>
          <input id="gTitle" type="text" value="${esc(d.title)}" placeholder="Term Life"></div>
        <div><label for="gSlug">URL slug</label>
          <input id="gSlug" type="text" value="${esc(d.slug)}" placeholder="lh-term-life"
            ${d.completions?'readonly title="Agents have completed this module — slug is locked"':''}></div>
      </div>
      <label for="gSub">Subtitle</label>

      <div style="height:14px"></div>
      <div class="form-row">
        <div><label for="gTrack">Category</label>
          <select id="gTrack">${tracks.map(t=>
            `<option value="${esc(t.slug)}" ${d.track===t.slug?"selected":""}>${esc(t.name)}</option>`).join("")}</select></div>
        <div><label for="gMin">Estimated minutes</label>
          <input id="gMin" type="text" value="${d.estimated_minutes}" inputmode="numeric"></div>
      </div>
      <div class="form-row">
        <div><label for="gFmt">Format</label>
          <select id="gFmt">
            <option value="internal" ${d.format==="internal"?"selected":""}>Internal — content and quiz in the portal</option>
            <option value="external" ${d.format==="external"?"selected":""}>External — link out, agent confirms completion</option>
          </select></div>
        <div id="gExtWrap" class="${d.format==="external"?"":"hidden"}">
          <label for="gExtUrl">Link to the external training</label>

      </div>

      </div>

      <div class="section-h" style="margin:22px 0 10px">

      <div id="itemList">${d.items.map(itemRow).join("") ||

          ${d.quiz?`<label style="text-transform:none;letter-spacing:normal;font-size:13px;
              margin:0;display:flex;align-items:center;gap:7px;color:var(--ink-2)">Pass mark
            <input id="gPass" type="text" value="${d.quiz.pass_pct}" inputmode="numeric"
              style="width:62px;padding:6px 9px">%</label>
          <button class="btn line sm" id="addQ">+ Add question</button>

const KINDS = {point:"Key point", doc:"Document link", task:"Practical task"};
function itemRow(it,i){
  return `<div class="card pad" style="padding:13px 15px;margin-bottom:9px" data-item="${i}">
    <div style="display:flex;gap:9px;align-items:center;margin-bottom:9px">
      <select class="i-kind" style="width:auto;padding:6px 9px;font-size:13px">
        ${Object.entries(KINDS).map(([k,v])=>
          `<option value="${k}" ${it.kind===k?"selected":""}>${esc(v)}</option>`).join("")}</select>
      <div style="flex:1"></div>
      <button class="btn line sm i-up">↑</button>
      <button class="btn line sm i-down">↓</button>
      <button class="btn line sm i-del" style="color:var(--bad)">Remove</button>
    </div>
    <input class="i-label" type="text" value="${esc(it.label||"")}" placeholder="The point, stated plainly">
    <div style="height:8px"></div>
    <textarea class="i-detail" rows="2" placeholder="Supporting detail (optional)">${esc(it.detail||"")}</textarea>
    <div style="height:8px"></div>
    <input class="i-url" type="text" value="${esc(it.url||"")}" placeholder="Link (optional) — https://…">
  </div>`;
}
function qRow(q,i){
  const opts = q.options||[];
  return `<div class="card pad" style="padding:13px 15px;margin-bottom:9px" data-q="${i}">
    <div style="display:flex;gap:9px;align-items:center;margin-bottom:9px">
      <b style="font-size:13px;color:var(--ink-3)">Question ${i+1}</b>
      <div style="flex:1"></div>
      <button class="btn line sm q-up">↑</button>
      <button class="btn line sm q-down">↓</button>
      <button class="btn line sm q-del" style="color:var(--bad)">Remove</button>
    </div>
    <input class="q-prompt" type="text" value="${esc(q.prompt||"")}" placeholder="The question">
    <div style="height:9px"></div>
    <div class="tsub" style="margin-bottom:6px">Tick the correct answer</div>
    ${[0,1,2,3].map(n=>`
      <div style="display:flex;gap:9px;align-items:center;margin-bottom:6px">
        <input type="radio" name="correct${i}" class="q-correct" value="${n}"
          ${q.correct_index===n?"checked":""} style="accent-color:var(--navy-3);flex:none">
        <input class="q-opt" type="text" value="${esc(opts[n]||"")}" placeholder="Option ${n+1}">
      </div>`).join("")}
    <div style="height:6px"></div>
    <textarea class="q-expl" rows="2" placeholder="Explanation shown after answering (optional)">${esc(q.explanation||"")}</textarea>
  </div>`;
}

function collectModule(){
  const modal = $("#modal"), g = s => modal.querySelector(s);
  const items = [...modal.querySelectorAll("[data-item]")].map(el=>({
    kind: el.querySelector(".i-kind").value,
    label: el.querySelector(".i-label").value.trim(),
    detail: el.querySelector(".i-detail").value.trim(),
    url: el.querySelector(".i-url").value.trim()
  })).filter(x=>x.label);
  let quiz = null;
  if(g("#gPass")){
    const questions = [...modal.querySelectorAll("[data-q]")].map(el=>{
      const opts = [...el.querySelectorAll(".q-opt")].map(o=>o.value.trim()).filter(Boolean);
      const picked = el.querySelector(".q-correct:checked");
      return { prompt: el.querySelector(".q-prompt").value.trim(), options: opts,
               correct_index: picked ? Number(picked.value) : 0,
               explanation: el.querySelector(".q-expl").value.trim() };
    }).filter(q=>q.prompt && q.options.length>=2);
    quiz = { pass_pct: parseInt(g("#gPass").value,10)||80, questions };
  }
  return {
    slug: g("#gSlug").value.trim(), title: g("#gTitle").value.trim(),
    subtitle: g("#gSub").value.trim(), overview: g("#gOv").value.trim(),
    track: g("#gTrack").value, estimated_minutes: parseInt(g("#gMin").value,10)||30,
    format: g("#gFmt").value,
    external_url: g("#gExtUrl") ? g("#gExtUrl").value.trim() : "",
    external_provider: g("#gProv") ? g("#gProv").value.trim() : "",
    items, quiz
  };
}

function wireModuleEditor(slug){
  const modal = $("#modal"), g = s => modal.querySelector(s);
  modal.scrollTop = 0;
  const stash = () => { const c = collectModule(); Object.assign(draft, c); };

  g("#mClose").addEventListener("click", closeModal);
  g("#mCancel").addEventListener("click", closeModal);
  if(!slug) g("#gTitle").addEventListener("input", e=>{
    const sl = g("#gSlug");
    if(!sl.dataset.touched) sl.value = e.target.value.toLowerCase()
      .replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  });
  g("#gSlug").addEventListener("input", e=>e.target.dataset.touched="1");
  g("#gFmt").addEventListener("change", ()=>{ stash(); draft.format=g("#gFmt").value; drawModuleEditor(slug); });

  g("#addItem").addEventListener("click", ()=>{
    stash(); draft.items.push({kind:"point",label:"",detail:"",url:""}); drawModuleEditor(slug);
  });
  modal.querySelectorAll("[data-item]").forEach(el=>{
    const i = Number(el.dataset.item);
    el.querySelector(".i-del").addEventListener("click",()=>{
      stash(); draft.items.splice(i,1); drawModuleEditor(slug); });
    el.querySelector(".i-up").addEventListener("click",()=>{
      stash(); if(i>0){ [draft.items[i-1],draft.items[i]]=[draft.items[i],draft.items[i-1]];
        drawModuleEditor(slug);} });
    el.querySelector(".i-down").addEventListener("click",()=>{
      stash(); if(i<draft.items.length-1){ [draft.items[i+1],draft.items[i]]=[draft.items[i],draft.items[i+1]];
        drawModuleEditor(slug);} });
  });

  const mk = g("#mkQuiz");
  if(mk) mk.addEventListener("click",()=>{
    stash(); draft.quiz = {pass_pct:80, questions:[{prompt:"",options:["","","",""],correct_index:0,explanation:""}]};
    drawModuleEditor(slug);
  });
  const nq = g("#noQuiz");
  if(nq) nq.addEventListener("click",()=>{ stash(); draft.quiz=null; drawModuleEditor(slug); });
  const aq = g("#addQ");
  if(aq) aq.addEventListener("click",()=>{
    stash(); draft.quiz.questions.push({prompt:"",options:["","","",""],correct_index:0,explanation:""});
    drawModuleEditor(slug);
  });
  modal.querySelectorAll("[data-q]").forEach(el=>{
    const i = Number(el.dataset.q);
    el.querySelector(".q-del").addEventListener("click",()=>{
      stash(); draft.quiz.questions.splice(i,1); drawModuleEditor(slug); });
    el.querySelector(".q-up").addEventListener("click",()=>{
      stash(); const q=draft.quiz.questions;
      if(i>0){ [q[i-1],q[i]]=[q[i],q[i-1]]; drawModuleEditor(slug);} });
    el.querySelector(".q-down").addEventListener("click",()=>{
      stash(); const q=draft.quiz.questions;
      if(i<q.length-1){ [q[i+1],q[i]]=[q[i],q[i+1]]; drawModuleEditor(slug);} });
  });

  g("#mPreview").addEventListener("click",()=>{ stash(); previewModule(slug); });

  g("#mSave").addEventListener("click", async ()=>{
    const b = g("#mSave"); b.disabled=true; b.textContent="Saving…";
    const payload = collectModule();
    try{
      const r = await rpc("training_save_module",{p_code:CODE,p_slug:slug,p_payload:payload});
      closeModal(); await loadCatalog(); mgrContent();
      toast(`Saved — ${r.item_count} key points, ${r.question_count} questions`);
    }catch(ex){
      b.disabled=false; b.textContent="Save";
      const e2=g("#mErr"); e2.textContent=ex.message; e2.classList.remove("hidden"); modal.scrollTop=0;
    }
  });
  const rt = g("#mRetire");
  if(rt) rt.addEventListener("click", async ()=>{
    if(rt.dataset.armed!=="1"){ rt.dataset.armed="1"; rt.textContent="Click again to retire"; return; }
    rt.disabled=true;
    await rpc("training_retire",{p_code:CODE,p_kind:"module",p_slug:slug});
    closeModal(); await loadCatalog(); mgrContent(); toast("Module retired");
  });
}

/* Render the draft exactly as an agent would see it, without saving anything */
function previewModule(slug){
  const d = draft, modal = $("#modal");
  const key = d.slug || "__preview__";
  const fake = {...d, slug:key, status:"not_started", best_attempt:null, signoff:null, completed_at:null,
    quiz: d.quiz && d.quiz.questions.length
      ? {question_count:d.quiz.questions.length, pass_pct:d.quiz.pass_pct} : null};
  // modCard reads openMods to decide whether to draw the body, so open it just for this render
  const had = openMods.has(key); openMods.add(key);
  const html = modCard(fake, 0);
  if(!had) openMods.delete(key);

  modal.innerHTML = `<div class="sheet wide">
    <div class="sheet-h"><h3>Preview — how an agent sees this</h3><button class="x" id="pClose">×</button></div>
    <div class="sheet-b" style="background:var(--bg)">
      <div style="pointer-events:none">${html}</div>
    </div>
    <div class="sheet-f"><button class="btn" id="pBack">Back to editing</button></div></div>`;
  modal.scrollTop = 0;
  modal.querySelector("#pClose").addEventListener("click", closeModal);
  modal.querySelector("#pBack").addEventListener("click", ()=>drawModuleEditor(slug));
}

/* ================= restore from url ================= */
(async function init(){
  const m = location.hash.match(/c=([^&]+)/);
  if(m){
    const code = decodeURIComponent(m[1]).toUpperCase();
    try{ ME = await rpc("training_login",{p_code:code}); CODE=code; await boot(); }
    catch(e){ location.hash=""; }
  }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Insurance — Training Portal</title>
<style>
:root{
  /* brand navy sampled straight from the Metro Insurance logo artwork */
  --navy:#1F204F; --navy-2:#2A2B66; --navy-3:#3B3D80;
  --gold:#c8952b; --gold-soft:#f3e2bd; --gold-deep:#7a5710;
  --bg:#f5f6fa; --card:#ffffff; --line:#e3e5ee; --line-2:#c8cbdb;
  --ink:#16182e; --ink-2:#4a4e66; --ink-3:#7c80a1;
  --ok:#1a7f52; --ok-bg:#e6f5ee; --warn:#b0700d; --warn-bg:#fdf3e0;
  --bad:#b3261e; --bad-bg:#fdecea; --info:#3B3D80; --info-bg:#ecedf7;
  --r:12px; --shadow:0 1px 2px rgba(20,22,54,.06),0 8px 24px rgba(20,22,54,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:650;letter-spacing:-.01em}
a{color:var(--navy-3)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none !important}

/* ---------- shell ---------- */
.topbar{background:var(--navy);color:#fff;padding:0 22px;position:sticky;top:0;z-index:40;
  box-shadow:0 2px 12px rgba(15,16,45,.2)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .logo{--logo-1:#fff;--logo-2:#fff;--logo-3:#fff;width:116px;height:35px;flex:none;display:block}
.brand .rule{width:1px;height:26px;background:rgba(255,255,255,.24);flex:none}
.brand .prog{font-size:13.5px;font-weight:600;color:#d3d5ea;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:#c3c6e0}
.who b{color:#fff;font-weight:600}
.btn-ghost{color:#c3c6e0;border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:8px;font-size:13px}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:#fff}
/* Feedback lives in the header on every page deliberately: someone who has just hit the
   thing they want to report should not have to go looking for where to say so. */
.btn-feed{background:var(--gold);color:#241a06;border:0;padding:7px 13px;border-radius:8px;
  font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:7px;flex:none}
.btn-feed:hover{background:#d9a63c}
.btn-feed svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 80px}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1100px 600px at 50% -12%,#3a3c80 0%,var(--navy) 55%,#0d0e26 100%)}
.login-card{width:100%;max-width:440px;background:#fff;border-radius:18px;padding:34px 32px;
  box-shadow:0 24px 70px rgba(8,9,26,.45)}
.login-card .logo{width:206px;height:62px;display:block;margin:0 0 20px -4px}
.login-card h1{font-size:21px}
.login-card p.sub{color:var(--ink-2);font-size:14px;margin:8px 0 22px}
label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
input[type=text],input[type=email],input[type=date],textarea,select{
  width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:9px;font:inherit;
  background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--navy-3);outline-offset:1px;border-color:transparent}
.btn{background:var(--navy);color:#fff;padding:11px 18px;border-radius:9px;font-weight:600;font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.btn:hover{background:var(--navy-2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.wide{width:100%}
.btn.gold{background:var(--gold);color:#1b1405}.btn.gold:hover{background:#b6851f}
.btn.sm{padding:7px 13px;font-size:13.5px;border-radius:8px}
.btn.line{background:#fff;color:var(--navy);border:1px solid var(--line-2)}
.btn.line:hover{background:#f1f3f8}
.err{background:var(--bad-bg);color:var(--bad);border:1px solid #f3c9c5;padding:10px 13px;
  border-radius:9px;font-size:13.5px;margin-bottom:16px}
.login-hint{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-3);line-height:1.6}

/* ---------- shared bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink-3)}

.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 100%);color:#fff;
  border-radius:16px;padding:26px 28px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero h1{font-size:23px;margin-bottom:6px}
.hero p{margin:0;color:#c3c6e0;font-size:14px}
.hero-row{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.hero-row>div:first-child{flex:1;min-width:230px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:23px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1}
.ring .lbl span{font-size:10.5px;color:#b2b5d4;text-transform:uppercase;letter-spacing:.07em}

.bar{height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--navy-3),var(--gold));border-radius:99px;
  transition:width .5s ease}
.bar.on-dark{background:rgba(255,255,255,.2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px;
  border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.prog{background:var(--warn-bg);color:var(--warn)}
.pill.todo{background:#eef0f6;color:var(--ink-3)}
.pill.score{background:var(--info-bg);color:var(--info)}
.pill.fail{background:var(--bad-bg);color:var(--bad)}
.pill.sign{background:var(--gold-soft);color:var(--gold-deep)}
.pill.ext{background:#ecedf7;color:var(--navy-3)}
.pill.req{background:#eef0f6;color:var(--ink-3);text-transform:uppercase;font-size:10px;letter-spacing:.06em}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 13px}
.section-h h2{font-size:17px}
.section-h .note{font-size:13px;color:var(--ink-3)}

/* ---------- certification cards ---------- */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.cert{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.cert:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-2)}
.cert.earned:before{background:var(--gold)}
.cert.expired:before{background:var(--bad)}
.cert .seal{font-size:17px;line-height:1}
.cert .cn{font-size:13.5px;font-weight:650;margin:7px 0 3px}
.cert .cm{font-size:12px;color:var(--ink-3)}
.cert .cnum{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink-3);margin-top:6px}
.cert .cbtn{margin-top:10px}

/* ---------- tracks ---------- */
.track{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;
  box-shadow:var(--shadow);overflow:hidden}
.track-head{display:flex;gap:15px;padding:17px 20px;align-items:center;width:100%;text-align:left}
.track-head:hover{background:#fafbfd}
.track-head .tk{flex:1;min-width:0}
.track-head h3{font-size:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.track-head .tl{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.track-prog{display:flex;align-items:center;gap:11px;flex:none;width:180px}
.track-prog b{font-size:13px;width:38px;text-align:right}
.track-body{border-top:1px solid var(--line);padding:14px 16px 16px;background:#fafbfd}
@media(max-width:640px){ .track-prog{width:120px} }

/* ---------- modules ---------- */
.mod{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;overflow:hidden}
.mod:last-child{margin-bottom:0}
.mod.is-done{border-color:#bfe3d1}
.mod-head{display:flex;gap:13px;padding:14px 16px;align-items:flex-start;cursor:pointer;width:100%;text-align:left}
.mod-head:hover{background:#fafbfd}
.num{width:28px;height:28px;border-radius:8px;background:#eef0f7;color:var(--navy-3);display:grid;
  place-items:center;font-weight:700;font-size:13px;flex:none;margin-top:1px}
.mod.is-done .num{background:var(--ok-bg);color:var(--ok)}
.mod-head .txt{flex:1;min-width:0}
.mod-head h4{font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:650}
.mod-head .sub{color:var(--ink-2);font-size:13px;margin-top:3px}
.mod-head .meta{color:var(--ink-3);font-size:11.5px;margin-top:5px;display:flex;gap:11px;flex-wrap:wrap}
.chev{color:var(--ink-3);font-size:11px;margin-top:5px;flex:none;transition:transform .2s}
.mod.open .chev{transform:rotate(180deg)}
.mod-body{border-top:1px solid var(--line);padding:16px 18px 18px;background:#fbfcfe}
.mod-body .ov{color:var(--ink-2);font-size:13.5px;margin:0 0 14px}
.items{list-style:none;padding:0;margin:0 0 16px}
.items li{display:flex;gap:11px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.items li:last-child{border-bottom:0}
.ico{width:19px;height:19px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;margin-top:2px}
.ico.point{background:var(--info-bg);color:var(--navy-3)}
.ico.doc{background:var(--gold-soft);color:var(--gold-deep)}
.ico.task{background:var(--ok-bg);color:var(--ok)}
.items .l{font-weight:600;font-size:13.5px}
.items .d{color:var(--ink-2);font-size:13px;margin-top:2px}
.items .d mark{background:#fdf3e0;color:var(--warn);padding:1px 5px;border-radius:4px;font-weight:650}
.items a.docl{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;
  text-decoration:none;border-bottom:1px solid var(--line-2)}
.items a.docl:hover{border-color:var(--navy-3)}
.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding-top:2px}
.extbox{background:var(--info-bg);border:1px solid #d5d8ee;border-radius:10px;padding:13px 15px;margin-bottom:14px}
.extbox .et{font-weight:650;font-size:13.5px;margin-bottom:3px}
.extbox .ed{font-size:13px;color:var(--ink-2)}

/* ---------- modal / quiz ---------- */
.ov-back{position:fixed;inset:0;background:rgba(10,11,30,.62);z-index:60;display:grid;
  place-items:start center;padding:34px 18px;overflow:auto}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:720px;box-shadow:0 30px 80px rgba(6,8,24,.5)}
.sheet.wide{max-width:900px}
.sheet-h{display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.sheet-h h3{font-size:17px;flex:1}
.sheet-b{padding:22px 24px}
.sheet-f{padding:16px 24px 22px;border-top:1px solid var(--line);display:flex;gap:10px;
  align-items:center;flex-wrap:wrap}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);font-size:19px}
.x:hover{background:#f1f3f8;color:var(--ink)}
.q{padding:17px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q .qp{font-weight:620;font-size:14.5px;margin-bottom:11px;display:flex;gap:9px}
.q .qp i{color:var(--ink-3);font-style:normal;font-weight:700;flex:none}
.opt{display:flex;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  margin-bottom:7px;cursor:pointer;font-size:14px;align-items:flex-start;background:#fff}
.opt:hover{border-color:var(--navy-3);background:#f8f9fc}
.opt input{margin-top:3px;accent-color:var(--navy-3);flex:none}
.opt.correct{border-color:#8fd0ae;background:var(--ok-bg)}
.opt.wrong{border-color:#efb5b0;background:var(--bad-bg)}
.expl{font-size:13px;color:var(--ink-2);background:#f1f3f8;border-left:3px solid var(--navy-3);
  padding:9px 12px;border-radius:0 8px 8px 0;margin-top:9px}
.result{text-align:center;padding:8px 0 20px}
.result .big{font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1}
.result .msg{margin-top:8px;font-size:14.5px;color:var(--ink-2)}
.result.pass .big{color:var(--ok)} .result.fail .big{color:var(--bad)}

/* ---------- certificate ---------- */
.certdoc{border:2px solid var(--navy);border-radius:6px;padding:38px 44px;text-align:center;
  background:#fff;position:relative}
.certdoc:after{content:"";position:absolute;inset:9px;border:1px solid var(--gold);border-radius:3px;
  pointer-events:none}
.certdoc .logo{width:230px;height:70px;margin:0 auto 22px;display:block}
.certdoc .ct{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
.certdoc .cwho{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:16px 0 6px;color:var(--navy)}
.certdoc .cfor{font-size:14px;color:var(--ink-2);margin-bottom:18px}
.certdoc .cname{font-size:21px;font-weight:700;color:var(--navy);margin-bottom:6px}
.certdoc .cmeta{font-size:13px;color:var(--ink-2)}
.certdoc .crule{height:1px;background:var(--line);margin:24px 0 18px}
.certdoc .cfoot{display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--ink-3);
  text-align:left;flex-wrap:wrap}
.certdoc .cfoot b{display:block;color:var(--ink);font-size:13px;font-weight:650}

/* ---------- manager ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 15px;font-size:14px;font-weight:600;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  font-weight:650;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:#f8f9fc}
.tname{font-weight:640}
.tsub{font-size:12.5px;color:var(--ink-3)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:#eef0f7;
  padding:3px 8px;border-radius:6px;color:var(--navy)}
.mini-bar{width:112px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px;background:#eef0f6;color:var(--ink-3)}
.chip.gold{background:var(--gold-soft);color:var(--gold-deep)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.mcell{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff}
.mcell .mt{font-size:13.5px;font-weight:620;margin-bottom:7px}
.mcell .mr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3);font-size:14px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:90;
  box-shadow:0 12px 34px rgba(6,8,24,.42);opacity:0;transition:.28s;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
/* these are <label> elements, so undo the global form-label typography */
.tgl{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer;
  text-transform:none;letter-spacing:normal;font-size:15px;font-weight:400;color:var(--ink)}
.tgl:hover{border-color:var(--navy-3);background:#fafbfd}
.tgl input{accent-color:var(--navy-3);width:16px;height:16px;flex:none}
.tgl .tn{font-weight:620;font-size:14px}
.tgl .td{font-size:12.5px;color:var(--ink-3)}
.trackgrp{margin-bottom:22px}
.trackgrp>h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-bottom:9px}

@media(max-width:640px){
  .form-row{grid-template-columns:1fr}
  .hide-sm{display:none}
  .wrap{padding:18px 14px 60px}
  .hero{padding:20px}
  .topbar{padding:0 14px}
  .brand .rule,.brand .prog{display:none}
  .brand .logo{width:104px;height:31px}
  .who,.btn-ghost{white-space:nowrap}
  .who{font-size:12.5px}
  .btn-ghost{padding:6px 10px}
  /* the icon still reads as "say something" once the word is gone */
  .btn-feed{padding:7px 9px}
  .btn-feed .lbl{display:none}
  .track-head{flex-wrap:wrap}
  .certdoc{padding:24px 20px}
  .certdoc .cwho{font-size:24px}
}

/* ---------- print: certificate only ---------- */
@media print{
  body{background:#fff}
  body>*{display:none !important}
  #modal{display:block !important;position:static;padding:0;background:none;overflow:visible}
  #modal .sheet{box-shadow:none;max-width:none;border-radius:0}
  #modal .sheet-h,#modal .sheet-f{display:none !important}
  #modal .sheet-b{padding:0}
  .certdoc{border-width:3px}
  @page{size:landscape;margin:12mm}
}

/* ---------- call monitoring ---------- */
.cm-note{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.cm-banner{background:var(--info-bg);border:1px solid #d5d7ee;border-left:4px solid var(--info);
  border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.cm-banner.warn{background:var(--warn-bg);border-color:#eddcbb;border-left-color:var(--warn)}
.cm-banner h4{font-size:14.5px;margin-bottom:5px}
.cm-sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cm-sub button{border:1px solid var(--line-2);background:#fff;border-radius:999px;
  padding:6px 14px;font-size:13px;color:var(--ink-2)}
.cm-sub button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.cm-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:13px}
.cm-ctl select{font:inherit;padding:6px 10px;border:1px solid var(--line-2);border-radius:8px;background:#fff}
.sev{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.sev.HIGH{background:var(--bad-bg);color:var(--bad)}
.sev.MEDIUM{background:var(--warn-bg);color:var(--warn)}
.sev.LOW{background:var(--info-bg);color:var(--info)}
.modlink{font-size:12.5px;color:var(--navy-3);font-weight:600}
.modlink.none{color:var(--bad);font-weight:600}
.spark{display:flex;align-items:flex-end;gap:3px;height:42px}
.spark i{flex:1;background:var(--navy-3);border-radius:2px 2px 0 0;min-height:2px;opacity:.75}
.ev{background:#f8f9fc;border-left:3px solid var(--line-2);padding:8px 12px;margin:7px 0;
  border-radius:0 8px 8px 0;font-size:13px;color:var(--ink-2);font-style:italic}
.tscript{background:#fbfbfd;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  max-height:340px;overflow:auto;font-size:13px;line-height:1.7;white-space:pre-wrap}
.tscript b{color:var(--navy)}
.cm-score{font-size:26px;font-weight:700;letter-spacing:-.02em}
.cm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.cm-grid2{grid-template-columns:1fr}}

/* ---------- call search ---------- */
.cs-form{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;align-items:end}
@media(max-width:900px){.cs-form{grid-template-columns:repeat(2,1fr)}}
.cs-form label{display:block;font-size:12px;font-weight:650;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.cs-form input,.cs-form select{width:100%;font:inherit;font-size:14px;padding:8px 10px;
  border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--ink)}
.cs-form .wide{grid-column:span 2}
.cs-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}
.cs-snip{font-size:13px;color:var(--ink-2);background:#fbfbfd;border-left:3px solid var(--gold);
  padding:7px 11px;border-radius:0 8px 8px 0;margin-top:6px;line-height:1.6}
.cs-snip mark{background:var(--gold-soft);color:var(--gold-deep);font-weight:650;padding:0 2px;border-radius:3px}
.cs-count{font-size:13.5px;color:var(--ink-2)}
.cs-pager{display:flex;gap:9px;align-items:center;justify-content:center;margin-top:16px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="view-login" class="login-wrap">
  <div class="login-card">
    <svg class="logo" role="img" aria-label="Metro Insurance"><use href="#mia-logo"/></svg>
    <h1>Training Portal</h1>
    <p class="sub">Metro Insurance Agencies, LLC — enter your access code to open your training and certifications.</p>
    <div id="loginErr" class="err hidden"></div>
    <form id="loginForm">
      <label for="code">Access code</label>
      <input id="code" type="text" placeholder="MIA-XXXX-XXXX-XXXX" autocomplete="off"
             spellcheck="false" autocapitalize="characters" style="letter-spacing:.04em" required>
      <div style="height:16px"></div>
      <button class="btn wide" type="submit" id="loginBtn">Open my training</button>
    </form>
    <div class="login-hint">
      Your Senior Manager issues your access code. Progress and certifications save automatically
      and are visible to management as you go.
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="view-app" class="hidden">
  <div class="topbar">
    <div class="topbar-in">
      <div class="brand">
        <svg class="logo" role="img" aria-label="Metro Insurance"><use href="#mia-logo"/></svg>
        <div class="rule"></div>
        <div class="prog">Training Portal</div>
      </div>
      <div class="spacer"></div>
      <div class="who"><span class="hide-sm">Signed in as</span> <b id="whoName"></b></div>
      <button class="btn-feed" id="feedBtn" title="Tell Braden about a problem or an idea">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4
          a8.9 8.9 0 0 1-3.8-.8L3 21l1.9-4.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>
        <span class="lbl">Feedback</span></button>
      <button class="btn-ghost hidden" id="modeToggle"></button>
      <button class="btn-ghost" id="signOut">Sign out</button>
    </div>
  </div>
  <div class="wrap">
    <div id="paneTrainee" class="hidden"></div>
    <div id="paneManager" class="hidden"></div>
  </div>
</div>

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// authored review flags like [NEEDS REVIEW — ...] get highlighted rather than hidden
const flag = s => esc(s).replace(/\[(NEEDS REVIEW|VERIFY)([^\]]*)\]/g,
  (m,a,b)=>`<mark>${a}${esc0(b)}</mark>`);
const esc0 = s => String(s ?? "");

async function rpc(fn, params){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{ "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}`,
              "Content-Type":"application/json" },
    body: JSON.stringify(params||{})
  });
  const txt = await r.text();
  let data=null; try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
  if(!r.ok){
    const m = (data && (data.message||data.hint)) || "Request failed";
    throw new Error(
      /INVALID_CODE/.test(m) ? "That access code was not recognized." :
      /NOT_MANAGER/.test(m)  ? "That code does not have manager access." :
      /TRACK_IS_REQUIRED_FOR_ALL/.test(m) ? "That track is required for everyone and cannot be removed." :
      /NO_CERT/.test(m) ? "No certification on file for that track yet." :
      /NO_OFFICE/.test(m) ? "That is not one of the agency's locations." :
      /NOT_ENROLLED/.test(m) ? "That person is not enrolled in the portal yet — add them under Add an agent first." :
      /NO_MODULE/.test(m) ? "That module no longer exists." :
      /NO_CALL_ACCESS/.test(m) ? "Your code does not have call monitoring access." :
      /NO_CALL_DETAIL/.test(m) ? "Your code sees agency patterns only, not individual agents." : m);
  }
  return data;
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600);
}
function when(ts){
  if(!ts) return "—";
  const d=new Date(ts), diff=(new Date()-d)/1000;
  if(diff<60) return "just now";
  if(diff<3600) return Math.floor(diff/60)+" min ago";
  if(diff<86400) return Math.floor(diff/3600)+" hr ago";
  if(diff<604800) return Math.floor(diff/86400)+"d ago";
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function fdate(s){
  if(!s) return "—";
  const d = s.length<=10 ? new Date(s+"T12:00:00") : new Date(s);
  return d.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
}
function sdate(s){
  if(!s) return "—";
  const d = s.length<=10 ? new Date(s+"T12:00:00") : new Date(s);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function ring(pct){
  const R=44, C=2*Math.PI*R, off=C*(1-pct/100);
  return `<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104">
      <circle cx="52" cy="52" r="${R}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="9"/>
      <circle cx="52" cy="52" r="${R}" fill="none" stroke="#c8952b" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
    <div class="lbl"><div><b>${pct}%</b><span>Complete</span></div></div></div>`;
}
const statusPill = s => s==="completed" ? '<span class="pill done">✓ Complete</span>'
  : s==="in_progress" ? '<span class="pill prog">● In progress</span>'
  : '<span class="pill todo">Not started</span>';
const pct = (d,t) => t ? Math.round(d*100/t) : 0;

// What to call someone. An explicit "goes by" wins; otherwise take the first name that is a
// name rather than an initial, so "W. Braden Garrett" greets as Braden, not W.
function firstName(person){
  if(!person) return "";
  const pref = (person.preferred_name||"").trim();
  if(pref) return pref;
  const parts = String(person.full_name||"").trim().split(/\s+/);
  const real = parts.find(x=>!/^[A-Za-z]\.?$/.test(x));
  return real || parts[0] || "";
}

/* ================= auth ================= */
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("#loginBtn"), err=$("#loginErr");
  const code=$("#code").value.trim().toUpperCase();
  if(!code) return;
  btn.disabled=true; btn.textContent="Checking…"; err.classList.add("hidden");
  try{
    const r = await rpc("training_login",{p_code:code});
    // A wrong code now comes back as a result rather than an error, so the failure can be
    // counted before the answer is returned. See training_login.
    if(!r || r.ok === false){
      err.textContent = r && r.error === "TOO_MANY_ATTEMPTS"
        ? "Too many wrong codes have been tried recently. Wait ten minutes and try again — "
          + "if this keeps happening, tell Braden, because it may not be you."
        : "That access code was not recognized.";
      err.classList.remove("hidden");
      return;
    }
    ME = r; CODE = code;
    rememberCode(code);
    await boot();
  }catch(ex){ err.textContent=ex.message; err.classList.remove("hidden"); }
  finally{ btn.disabled=false; btn.textContent="Open my training"; }
});

// The code used to be written into the address bar as #c=CODE so a refresh kept you signed
// in. That is exactly how a forwarded bookmark signed a new hire in as the Agency Owner on
// 11 August. sessionStorage does the same job without the credential ever entering a URL:
// a refresh still works, a forwarded link signs in nobody, and closing the tab forgets it.
function rememberCode(code){
  try{ sessionStorage.setItem("mia_code", code); }catch(e){}
}
function recallCode(){
  try{ return sessionStorage.getItem("mia_code"); }catch(e){ return null; }
}
function forgetCode(){
  try{ sessionStorage.removeItem("mia_code"); }catch(e){}
}
$("#signOut").addEventListener("click", ()=>{
  if(PREVIEW){ exitPreview(); return; }
  CODE=ME=STATE=MGR=null; selTrainee=null; lastAdded=null; MODE=null;
  CM=CMA=null; selCallAgent=null; cmSub="patterns"; cmScope="current"; cmDays=90;
  openMods.clear(); openTracks=null; location.hash=""; forgetCode();
  $("#modeToggle").classList.add("hidden");
  $("#view-app").classList.add("hidden");
  $("#view-login").classList.remove("hidden");
  $("#code").value="";
});
// Managers and owners are agents too. They get both halves of the portal and a header
// toggle between them, rather than being locked into one. Everyone else only ever has
// their own training, so no toggle is shown.
const isStaff = r => r === "manager" || r === "owner";

async function boot(){
  $("#view-login").classList.add("hidden");
  $("#view-app").classList.remove("hidden");
  $("#whoName").textContent = ME.full_name;
  const staff = isStaff(ME.role);
  $("#modeToggle").classList.toggle("hidden", !staff);
  // Staff land on the dashboard because that is the job they logged in to do;
  // their own training is one click away.
  await setMode(staff ? "manager" : "training");
}

// The single place that decides which half of the portal is on screen. Switching into
// "training" always refetches, so nothing left over from a preview can leak into a
// manager's real record.
async function setMode(mode){
  MODE = mode;
  PREVIEW = null;
  if(mode === "manager"){
    $("#paneTrainee").classList.add("hidden");
    $("#paneManager").classList.remove("hidden");
    $("#modeToggle").textContent = "My training";
    await loadManager();
  }else{
    $("#paneManager").classList.add("hidden");
    $("#paneTrainee").classList.remove("hidden");
    $("#modeToggle").textContent = isStaff(ME.role) ? "Manager dashboard" : "";
    STATE = null; openTracks = null; openMods.clear();
    await loadTrainee();
  }
  window.scrollTo(0,0);
}

function noteWhere(slug){
  if(!STATE || !STATE.tracks) return;
  for(const t of STATE.tracks){
    const m = (t.modules||[]).find(x=>x.slug===slug);
    if(m){ lastMod = t.name + " — " + m.title; return; }
  }
}

        <option value="" selected>Choose one…</option>
        ${FB_SUBJECTS.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}</select>
      <div style="height:15px"></div>
      <label for="fbWhere">Where in the portal <span style="text-transform:none;
        letter-spacing:normal;font-weight:400;color:var(--ink-3)">(edit if this is wrong)</span></label>
      <input id="fbWhere" type="text" value="${esc(feedbackWhere())}" maxlength="200">
      <div style="height:15px"></div>
      <label for="fbBody">What would you like to say</label>
      <textarea id="fbBody" rows="7" maxlength="5000"
        placeholder="For example: the placement rule in this module is not how we do it now — Traders stopped writing this class in June."></textarea>
    </div>
    <div class="sheet-f">
      <button class="btn" id="fbSend" disabled>Send to Braden</button>
      <button class="btn line" id="fbCancel">Cancel</button>
      <span style="font-size:13px;color:var(--ink-3)">Sent as ${esc(ME.full_name)}</span>
    </div></div>`;
  modal.scrollTop = 0;

  const g = s => modal.querySelector(s);
  const body = g("#fbBody"), send = g("#fbSend"), subj = g("#fbSubject");
  // Both a subject and something to say, or there is nothing useful to send.
  const check = ()=>{ send.disabled = !body.value.trim() || !subj.value; };
  body.addEventListener("input", check);
  subj.addEventListener("change", check);
  g("#fbClose").addEventListener("click", closeModal);
  g("#fbCancel").addEventListener("click", closeModal);
  subj.focus();

  send.addEventListener("click", async ()=>{
    const err = g("#fbErr");
    send.disabled = true; send.textContent = "Sending…"; err.classList.add("hidden");
    try{
      await rpc("training_feedback_submit", {
        p_code: CODE,
        p_subject: g("#fbSubject").value,
        p_body: body.value,
        p_context: g("#fbWhere").value.trim() || null
      });
      closeModal();
      toast("Thank you — that has gone to Braden");
      // If a manager is sitting on the Feedback tab, show it immediately rather than
      // leaving a stale list on screen.
      if(MODE === "manager" && mgrTab === "feedback"){ await loadFeedback(); mgrFeedback(); }
    }catch(ex){
      err.textContent = ex.message; err.classList.remove("hidden");
      send.disabled = false; send.textContent = "Send to Braden";
    }
  });
}

/* ================= trainee ================= */
async function loadTrainee(){
  STATE = await rpc("training_state",{p_code:CODE});
  // Kept out of training_state deliberately — that function is read by several things and
  // this is a small, separable question.
  if(!PREVIEW){
    try{ UPG = await rpc("training_upgrade_status",{p_code:CODE}); }
    catch(e){ UPG = null; }
  }
  if(openTracks === null){
    // first load: open whatever still needs work, so nobody has to hunt for it
    openTracks = new Set();
    for(const t of STATE.tracks){
      const done = t.modules.filter(m=>m.status==="completed").length;
      if(done < t.modules.length) openTracks.add(t.slug);
    }
    if(!openTracks.size && STATE.tracks[0]) openTracks.add(STATE.tracks[0].slug);
  }
  renderTrainee();
}

function renderTrainee(){
  const tracks = STATE.tracks || [];
  const all = tracks.flatMap(t=>t.modules);
  const done = all.filter(m=>m.status==="completed").length;
  const overall = pct(done, all.length);
  const earned = tracks.filter(t=>t.certification && !t.certification.expired).length;
  // an expired certification is the loudest signal here, so count it alongside near-expiry
  const recertDue = tracks.filter(t=>t.certification && (t.certification.expired
      || (t.certification.days_left !== null && t.certification.days_left <= 45))).length;
  const mins = all.filter(m=>m.status!=="completed").reduce((a,m)=>a+(m.estimated_minutes||0),0);
  const notices = STATE.notices || [];
  const unread = notices.filter(n=>!n.is_read).length;
  const mgr = STATE.manager;
  const next = all.find(m=>m.status!=="completed");

  $("#paneTrainee").innerHTML = `
    <div class="hero">
      <div class="hero-row">
        <div>
          <h1>${PREVIEW ? "Agent view" : "Welcome, "+esc(firstName(ME))}</h1>
          <p>${done===all.length && all.length
              ? "Every module in your assigned training is complete."
              : `Next up: <b style="color:#fff">${esc(next?next.title:"—")}</b>`}</p>
          <p style="margin-top:10px;font-size:13px;color:#b2b5d4">
            ${ME.location?esc(ME.location)+" · ":""}Start date ${sdate(ME.start_date)}
            ${mgr?` · ${mgr.role==="owner"?"Agency Owner":"Senior Manager"}: `+esc(mgr.full_name):""}
          </p>
        </div>
        ${ring(overall)}
      </div>
    </div>

    <div class="grid-stats">
      <div class="stat"><div class="k">Modules complete</div><div class="v">${done}<small> / ${all.length}</small></div></div>
      <div class="stat"><div class="k">Certifications held</div><div class="v">${earned}<small> / ${tracks.length}</small></div></div>
      <div class="stat"><div class="k">Recertification due</div><div class="v" style="${recertDue?'color:var(--warn)':''}">${recertDue}</div></div>
      <div class="stat"><div class="k">Est. time remaining</div><div class="v">${Math.round(mins/60*10)/10}<small> hrs</small></div></div>
    </div>

    ${previewBanner()}
    ${ceBanner()}
    ${upgradeCard()}

    <div class="section-h"><h2>My certifications</h2>
      <span class="note">Complete every module in a track to earn its certification.</span></div>
    <div class="certs">${tracks.map(certCard).join("")}</div>

    <div class="section-h">
      <h2>Progress updates</h2>
      ${unread?`<button class="btn line sm" id="markRead">Mark all read</button>`:`<span class="note">No new updates</span>`}
    </div>
    <div class="card">
      ${notices.length ? notices.slice(0,6).map(n=>`
        <div class="notice ${n.is_read?"read":""}" style="display:flex;gap:12px;padding:13px 16px;
             border-bottom:1px solid var(--line);align-items:flex-start">
          <div style="width:8px;height:8px;border-radius:99px;margin-top:7px;flex:none;
               background:${n.is_read?"var(--line-2)":"var(--gold)"}"></div>
          <div style="flex:1">
            <div style="font-weight:620;font-size:14px">${esc(n.title)}</div>
            ${n.body?`<div style="color:var(--ink-2);font-size:13.5px;margin-top:2px">${esc(n.body)}</div>`:""}
            <div style="font-size:11.5px;color:var(--ink-3);margin-top:4px">${when(n.created_at)}</div>
          </div>
        </div>`).join("")
        : `<div class="empty">Your progress updates will appear here as you complete modules and quizzes.</div>`}
    </div>

    <div class="section-h"><h2>Training tracks</h2>
      <span class="note">Read the material, then pass the quiz at 80% to complete a module.</span></div>
    <div id="trackList">${tracks.map(trackCard).join("")}</div>`;

  if(unread) $("#markRead").addEventListener("click", async ()=>{
    await rpc("training_notices_read",{p_code:CODE,p_audience:"trainee"});
    await loadTrainee(); toast("Updates marked read");
  });
  wireTrainee();

function certCard(t){
  const c = t.certification;
  const done = t.modules.filter(m=>m.status==="completed").length;
  const cls = !c ? "" : (c.expired ? "expired" : "earned");
  return `<div class="cert ${cls}">
    <div class="seal">${!c?"○":(c.expired?"⚠":"★")}</div>
    <div class="cn">${esc(t.cert_name)}</div>
    ${c ? `<div class="cm">${c.expired
              ? `Expired ${sdate(c.expires_at)}`
              : `Earned ${sdate(c.earned_at)}${c.expires_at?` · expires ${sdate(c.expires_at)}`:""}`}</div>
           <div class="cnum">${esc(c.cert_number)}</div>
           <div class="cbtn"><button class="btn line sm" data-cert="${esc(t.slug)}">View certificate</button></div>`
        : `<div class="cm">${done} of ${t.modules.length} modules complete</div>
           <div class="bar" style="margin-top:9px"><i style="width:${pct(done,t.modules.length)}%"></i></div>`}

}

// A Personal Lines agent asking to be put forward for commercial authority. Shown only to
// somebody it applies to, and only in their real view — a manager previewing the agent
// experience should not be able to file a request as somebody else.
function upgradeCard(){
  if(PREVIEW || !UPG) return "";
  const cur = UPG.current;
  const open = cur && ["requested","webce","scheduled"].includes(cur.status);

  if(open){
    const steps = [["requested","Requested"],["webce","On the WebCE course"],["scheduled","Exam booked"]];
    const at = steps.findIndex(s=>s[0]===cur.status);
    return `<div class="card pad" style="margin-bottom:16px;border-left:3px solid var(--gold)">
      <h3 style="font-size:15px;margin-bottom:4px">Adding commercial lines to your licence</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px">
        ${steps.map(([k,l],i)=>`<span class="pill ${i<at?"done":i===at?"prog":"todo"}">${
          i<at?"✓ ":i===at?"● ":""}${esc(l)}</span>`).join("")}
      </div>
      <div style="font-size:13.5px;color:var(--ink-2)">
        ${cur.status==="requested"
          ? "Belinda and Braden have your request. They will get you onto the WebCE course and book your exam."
          : cur.status==="webce"
            ? "You are enrolled on the WebCE course. Work through it at your own pace — the exam gets booked when you are ready."
            : `Your exam is booked${cur.exam_date?` for <b>${fdate(cur.exam_date)}</b>`:""}. Once you pass, the Commercial Lines modules appear here automatically.`}
        ${cur.staff_note?`<div class="expl" style="margin-top:9px">${esc(cur.staff_note)}</div>`:""}
      </div></div>`;
  }

  if(!UPG.eligible) return "";

  return `<div class="card pad" style="margin-bottom:16px">
    <h3 style="font-size:15px;margin-bottom:4px">Want to write commercial too?</h3>
    <p style="font-size:13.5px;color:var(--ink-2);margin:0 0 12px">
      Your licence covers personal lines. If you would like to add commercial authority, say so
      here — Belinda and Braden will get you onto the WebCE course and book your exam. Pass it and
      the Commercial Lines modules open up in your training automatically.</p>
    <textarea id="upgNote" rows="2" maxlength="600"
      placeholder="Anything worth us knowing — optional"></textarea>
    <div style="margin-top:10px"><button class="btn gold sm" id="upgAsk">Ask about commercial lines</button></div>
  </div>`;

function wireTrainee(){
  const root = $("#paneTrainee");
  if(PREVIEW){
    // reading only: keep the expand/collapse, disable everything that would write
    root.querySelectorAll("[data-track]").forEach(b=>b.addEventListener("click",()=>{
      const s=b.dataset.track; openTracks.has(s)?openTracks.delete(s):openTracks.add(s); renderTrainee();
    }));
    root.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",e=>{
      e.stopPropagation();
      const s=b.dataset.toggle; openMods.has(s)?openMods.delete(s):openMods.add(s); renderTrainee();
    }));
    root.querySelectorAll("[data-status],[data-attest],[data-quiz],[data-cert]").forEach(b=>{
      b.disabled = true; b.title = "Disabled while previewing";
      b.style.opacity = ".5"; b.style.cursor = "not-allowed";
    });
    const sw = root.querySelector("#pvSwap"), ex = root.querySelector("#pvExit");
    if(sw) sw.addEventListener("click", ()=>startPreview(
      PREVIEW.license === "licensed" ? "unlicensed" : "licensed"));
    if(ex) ex.addEventListener("click", exitPreview);
    return;
  }
  const ask = root.querySelector("#upgAsk");
  if(ask) ask.addEventListener("click", async ()=>{
    ask.disabled = true; ask.textContent = "Sending…";
    try{
      const note = root.querySelector("#upgNote");
      const r = await rpc("training_upgrade_request",
        {p_code:CODE, p_note: note ? note.value : null});
      if(r && r.ok === false){
        toast(r.reason === "already_open" ? "You already have a request in progress."
            : r.reason === "already_full" ? "Your licence already covers commercial lines."
            : "That request could not be sent.");
        ask.disabled = false; ask.textContent = "Ask about commercial lines";
        return;
      }
      UPG = await rpc("training_upgrade_status",{p_code:CODE});
      renderTrainee();
      toast("Sent — Belinda and Braden have it");
    }catch(ex){
      toast(ex.message); ask.disabled = false; ask.textContent = "Ask about commercial lines";
    }
  });
  root.querySelectorAll("[data-track]").forEach(b=>b.addEventListener("click",()=>{
    const s=b.dataset.track; openTracks.has(s)?openTracks.delete(s):openTracks.add(s); renderTrainee();
  }));
  root.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    const s=b.dataset.toggle; openMods.has(s)?openMods.delete(s):openMods.add(s);
    if(openMods.has(s)) noteWhere(s);
    renderTrainee();
  }));
  root.querySelectorAll("[data-status]").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation(); b.disabled=true;
    const r=await rpc("training_set_module_status",
      {p_code:CODE,p_slug:b.dataset.slug,p_status:b.dataset.status});
    await loadTrainee();
    toast(b.dataset.status==="completed"?`Module complete — ${r.percent}% overall`:"Marked in progress");
  }));
  root.querySelectorAll("[data-attest]").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation(); b.disabled=true;
    await rpc("training_attest",{p_code:CODE,p_slug:b.dataset.attest});
    await loadTrainee(); toast("Recorded — thanks for confirming");
  }));
  root.querySelectorAll("[data-quiz]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); openQuiz(b.dataset.quiz);
  }));
  root.querySelectorAll("[data-cert]").forEach(b=>b.addEventListener("click",()=>
    openCertificate(b.dataset.cert, null)));
}

/* ================= quiz ================= */
async function openQuiz(slug){
  const mod = (STATE.tracks.flatMap(t=>t.modules)).find(m=>m.slug===slug);
  const quiz = await rpc("training_quiz_get",{p_code:CODE,p_slug:slug});
  const answers = {};
  const modal = $("#modal"); modal.classList.remove("hidden");

  const draw = () => {
    modal.innerHTML = `<div class="sheet">
      <div class="sheet-h"><h3>${esc(quiz.title)}</h3><button class="x" id="qClose">×</button></div>
      <div class="sheet-b">
        <p style="margin:0 0 6px;color:var(--ink-2);font-size:14px">
          ${quiz.questions.length} questions · you need ${quiz.pass_pct}% to complete
          <b>${esc(mod.title)}</b>.</p>
        ${quiz.questions.map((q,i)=>`
          <div class="q" data-q="${q.id}">
            <div class="qp"><i>${i+1}.</i><span>${esc(q.prompt)}</span></div>
            ${q.options.map((o,oi)=>`<label class="opt">
                <input type="radio" name="q${q.id}" value="${oi}"><span>${esc(o)}</span></label>`).join("")}
          </div>`).join("")}
      </div>
      <div class="sheet-f">
        <button class="btn" id="qSubmit" disabled>Submit answers</button>
        <span id="qCount" style="font-size:13.5px;color:var(--ink-3)">0 of ${quiz.questions.length} answered</span>
      </div></div>`;
    modal.scrollTop = 0;
    modal.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",()=>{
      answers[r.closest(".q").dataset.q] = Number(r.value);
      const n = Object.keys(answers).length;
      modal.querySelector("#qCount").textContent = `${n} of ${quiz.questions.length} answered`;
      modal.querySelector("#qSubmit").disabled = n < quiz.questions.length;
    }));
    modal.querySelector("#qClose").addEventListener("click", closeModal);
    modal.querySelector("#qSubmit").addEventListener("click", submit);
  };

  async function submit(){
    const btn = modal.querySelector("#qSubmit");
    btn.disabled=true; btn.textContent="Grading…";
    const res = await rpc("training_quiz_submit",{p_code:CODE,p_slug:slug,p_answers:answers});
    modal.innerHTML = `<div class="sheet">
      <div class="sheet-h"><h3>Results — ${esc(mod.title)}</h3><button class="x" id="qClose2">×</button></div>
      <div class="sheet-b">
        <div class="result ${res.passed?"pass":"fail"}">
          <div class="big">${res.score_pct}%</div>
          <div class="msg">${res.correct_count} of ${res.question_count} correct.
            ${res.passed
              ? `You passed — <b>${esc(mod.title)}</b> is complete and your Senior Manager has been notified.`
              : `You need ${res.pass_pct}% to pass. Review the explanations below and try again.`}</div>
        </div>
        ${res.detail.map((d,i)=>`<div class="q">
            <div class="qp"><i>${i+1}.</i><span>${esc(d.prompt)}</span></div>
            ${d.options.map((o,oi)=>{
              const isC=oi===d.correct_index, isS=oi===d.selected;
              return `<div class="opt ${isC?"correct":(isS?"wrong":"")}" style="cursor:default">
                <span style="flex:none;width:16px;font-weight:700">${isC?"✓":(isS?"✕":"")}</span>
                <span>${esc(o)}</span></div>`;}).join("")}
            ${d.explanation?`<div class="expl">${esc(d.explanation)}</div>`:""}
          </div>`).join("")}
      </div>
      <div class="sheet-f">
        <button class="btn" id="qDone">Back to my training</button>
        ${!res.passed?`<button class="btn line" id="qRetry">Try again</button>`:""}
      </div></div>`;
    modal.scrollTop = 0;
    modal.querySelector("#qClose2").addEventListener("click", finish);
    modal.querySelector("#qDone").addEventListener("click", finish);
    const rt = modal.querySelector("#qRetry");
    if(rt) rt.addEventListener("click", ()=>{ for(const k in answers) delete answers[k]; draw(); });
  }
  async function finish(){ closeModal(); await loadTrainee(); }
  draw();
}
function closeModal(){ $("#modal").classList.add("hidden"); $("#modal").innerHTML=""; }

/* ================= manager ================= */
async function loadManager(){
  MGR = await rpc("training_manager_overview",{p_code:CODE});
  // Office list drives the roster's office picker. Fetched once and cached.
  if(!OFFICES){
    try{ OFFICES = await rpc("training_offices",{p_code:CODE}); }
    catch(e){ OFFICES = []; }
  }
  // Fetched separately rather than folded into training_manager_overview, which six other
  // things read — adding a field there is a change with a much wider blast radius.
  try{ LICTYPES = await rpc("training_license_types",{p_code:CODE}); }
  catch(e){ LICTYPES = {}; }
  // Loaded up front rather than on first click, so the count of unanswered feedback is
  // visible on the tab the moment the dashboard opens. Feedback nobody notices is worse
  // than no feedback button at all.
  await loadFeedback();
  renderManager();
}
function renderManager(){
  const ts = MGR.trainees||[], tracks = MGR.tracks||[];
  const notices = MGR.notices||[], unread = notices.filter(n=>!n.is_read).length;
  const avg = ts.length ? Math.round(ts.reduce((a,t)=>a+pct(t.completed,t.total_modules),0)/ts.length) : 0;
  const certs = ts.reduce((a,t)=>a+t.certs.filter(c=>!c.expired).length,0);
  const attention = ts.filter(t=>{
    if(t.certs.some(c=>c.expired || (c.days_left!==null && c.days_left<=45))) return true;
    if(t.completed >= t.total_modules) return false;
    if(!t.last_activity) return true;
    return (Date.now()-new Date(t.last_activity))/86400000 > 7;
  }).length;

  $("#paneManager").innerHTML = `
    <div class="hero">
      <div class="hero-row">
        <div>
          <h1>${ME.role==="owner"?"Agency Owner dashboard":"Senior Manager dashboard"}</h1>
          <p>Live training and certification status across the agency.</p>
          <p style="margin-top:10px;font-size:13px;color:#b2b5d4">
            ${ts.length} agent${ts.length===1?"":"s"} · ${tracks.length} tracks ·
            ${tracks.reduce((a,t)=>a+t.module_count,0)} modules
            ${unread?` · <b style="color:#f3e2bd">${unread} new update${unread===1?"":"s"}</b>`:""}
          </p>
          <div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap">
            <button class="btn gold sm" data-preview="licensed">View as a licensed agent</button>
            <button class="btn line sm" data-preview="unlicensed">View as an unlicensed hire</button>
          </div>
        </div>
        ${ring(avg)}
      </div>
    </div>
    <div class="grid-stats">
      <div class="stat"><div class="k">Active agents</div><div class="v">${ts.length}</div></div>
      <div class="stat"><div class="k">Average completion</div><div class="v">${avg}<small>%</small></div></div>
      <div class="stat"><div class="k">Certifications current</div><div class="v">${certs}</div></div>
      <div class="stat"><div class="k">Needs attention</div><div class="v" style="${attention?'color:var(--warn)':''}">${attention}</div></div>
    </div>
    <div class="tabs">
      <button class="tab ${mgrTab==="roster"?"on":""}" data-tab="roster">Roster</button>
      <button class="tab ${mgrTab==="ce"?"on":""}" data-tab="ce">Licensing &amp; CE</button>
      <button class="tab ${mgrTab==="content"?"on":""}" data-tab="content">Content editor</button>
      <button class="tab ${mgrTab==="tracks"?"on":""}" data-tab="tracks">Track catalog</button>
      ${cmHasCall() ? `<button class="tab ${mgrTab==="calls"?"on":""}" data-tab="calls">Call monitoring</button>` : ""}
      <button class="tab ${mgrTab==="activity"?"on":""}" data-tab="activity">Activity${unread?` (${unread})`:""}</button>
      <button class="tab ${mgrTab==="feedback"?"on":""}" data-tab="feedback">Feedback${
        FB && FB.open_count ? ` (${FB.open_count})` : ""}</button>
      <button class="tab ${mgrTab==="add"?"on":""}" data-tab="add">Add an agent</button>
    </div>
    <div id="mgrBody"></div>`;
  $("#paneManager").querySelectorAll("[data-preview]").forEach(b=>b.addEventListener("click",
    ()=>startPreview(b.dataset.preview)));
  $("#paneManager").querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click", async ()=>{
    mgrTab=b.dataset.tab; selTrainee=null;
    if(mgrTab==="content" && !CAT) await loadCatalog();
    if(mgrTab==="ce" && !CE) await loadCE();
    if(mgrTab==="calls" && !CM) await loadCallMonitor();
    if(mgrTab==="feedback") await loadFeedback();
    renderManager();
  }));
  // A tab a person cannot see must not be reachable by leftover state either.
  if(mgrTab === "calls" && !cmHasCall()) mgrTab = "roster";
  ({roster:mgrRoster, ce:mgrCE, content:mgrContent, tracks:mgrTracks,
    activity:mgrActivity, add:mgrAdd, calls:mgrCall, feedback:mgrFeedback})[mgrTab]();
}

// Personal Lines agents asking to add commercial authority. Sits on Licensing & CE because
// it is the same kind of thing as the CE cycle: a real-world process the portal records
// milestones for rather than runs. Passing the exam is the one step that does more than
// record a date — it sets the licence type, which opens the Commercial Lines modules.
function upgradeQueue(){
  const items = (UPGQ && UPGQ.items) || [];
  const open = items.filter(u=>["requested","webce","scheduled"].includes(u.status));
  if(!items.length) return "";

  const row = u => {
    const isOpen = ["requested","webce","scheduled"].includes(u.status);
    const next = u.status === "requested" ? [["webce","Enrolled on WebCE"]]
               : u.status === "webce"     ? [["scheduled","Book the exam"]]
               : u.status === "scheduled" ? [["passed","They passed"]]
               : [];
    return `<div style="padding:13px 16px;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <div style="font-weight:650;font-size:14.5px">${esc(u.who)}
            <span class="pill ${u.status==="passed"?"done":isOpen?"prog":"todo"}">${esc(u.label)}</span></div>
          <div class="tsub">${esc(u.office||"—")} · asked ${when(u.requested_at)}${
            u.exam_date?` · exam ${sdate(u.exam_date)}`:""}</div>
          ${u.request_note?`<div class="expl" style="margin-top:8px">${esc(u.request_note)}</div>`:""}
        </div>
        ${isOpen?`<div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center">
          ${u.status==="scheduled"?`<input type="date" data-upgdate="${u.id}"
             value="${esc(u.exam_date||"")}" style="width:150px">`:""}
          ${u.status==="webce"?`<input type="date" data-upgdate="${u.id}"
             placeholder="Exam date" style="width:150px">`:""}
          ${next.map(([s,l])=>`<button class="btn ${s==="passed"?"gold":"line"} sm"
             data-upg="${u.id}" data-upgs="${s}">${l}</button>`).join("")}
          <button class="btn line sm" data-upg="${u.id}" data-upgs="declined">Not now</button>
        </div>`:""}
      </div></div>`;
  };

  return `<div class="card" style="margin-bottom:16px">
    <div class="pad" style="padding-bottom:4px">
      <h3 style="font-size:15.5px">Commercial lines requests${open.length?` — ${open.length} open`:""}</h3>
      <p style="font-size:13px;color:var(--ink-2);margin:6px 0 0">
        Personal Lines agents who have asked to add commercial authority. Get them onto WebCE,
        book the exam, then mark them passed — that records the licence and opens the Commercial
        Lines modules in the same step. They are emailed at every stage.</p>
    </div>
    ${items.map(row).join("")}
  </div>`;
}

function wireUpgradeQueue(){
  const body = $("#mgrBody");
  body.querySelectorAll("[data-upg]").forEach(b=>b.addEventListener("click", async ()=>{
    const id = b.dataset.upg, status = b.dataset.upgs;
    const dateEl = body.querySelector(`[data-upgdate="${id}"]`);
    const exam = dateEl && dateEl.value ? dateEl.value : null;
    if(status === "scheduled" && !exam){ toast("Put the exam date in first"); return; }
    b.disabled = true;
    try{
      const r = await rpc("training_upgrade_advance",
        {p_code:CODE, p_id:id, p_status:status, p_exam_date:exam, p_note:null});
      await loadCE(); renderManager();
      toast(status === "passed"
        ? "Recorded — commercial authority and the Commercial Lines track are on their record"
        : "Updated, and they have been emailed");
    }catch(ex){ b.disabled = false; toast(ex.message); }
  }));
}

/* ================= call monitoring =================
   Reads the Call Monitoring project (recordings, transcripts, call_evaluations) and
   lines it up against the training content. Gated per person by call_monitor_access:
   'full' sees named agents and individual calls, 'aggregate' sees agency-wide patterns
   only. The gate is enforced in the database, not here — this only decides what to draw.

   Scoring shown is the CURRENTLY ACTIVE rubric by default, because the earlier rubric
   versions used different scales and averaging across them produces a meaningless
   trend. The earlier history is reachable, but always labelled. */

const cmHasCall = () => !!(ME && ME.call_monitor_access);
const cmFull    = () => ME && ME.call_monitor_access === "full";

async function loadCallMonitor(){
  CM = await rpc("training_call_overview",{p_code:CODE,p_days:cmDays,p_scope:cmScope});
}

const cmScoreColour = v =>
  v === null || v === undefined ? "var(--ink-3)"
  : v >= 85 ? "var(--ok)" : v >= 70 ? "var(--warn)" : "var(--bad)";

function cmModuleCell(r){
  if(!r.module_slug)
    return `<span class="modlink none">No module covers this</span>`;
  return `<span class="modlink">${esc(r.module_title||r.module_slug)}</span>`
       + (r.module_status === "draft" ? ` <span class="pill prog">Draft</span>` : "")
       + (r.track ? `<div class="tsub">${esc(r.track)}</div>` : "");
}

function mgrCall(){
  const body = $("#mgrBody");
  if(!CM){ body.innerHTML = `<div class="card"><div class="empty">Loading…</div></div>`; return; }

  const cov = CM.coverage||{}, sum = CM.summary||{};
  const onCurrent = CM.scope === "current";
  const nothingYet = (sum.calls||0) === 0;

  // Honest statement of what is on screen. The active rubric was created 11 August 2026
  // and has scored nothing yet, so without this the panel just looks broken.
  const banner = onCurrent
    ? `<div class="cm-banner ${nothingYet?"warn":""}">
         <h4>${nothingYet
              ? `Nothing scored on the current rubric yet`
              : `Showing rubric ${esc(CM.rubric.version||"")} only`}</h4>
         <div class="cm-note">
           ${nothingYet
             ? `Rubric <b>${esc(CM.rubric.version||"")}</b> became active ${when(CM.rubric.active_since)} and
                <b>${cov.awaiting_current_scoring||0}</b> recordings in this window have not been
                scored under it. There are <b>${cov.prior_rubric_evaluations||0}</b> evaluations on
                earlier rubric versions, which used different scales — an agency average of 47, then
                61, then 72, and one version that could score above 100 — so they are not mixed in
                here. This panel fills up as the Call Monitoring project rescores.`
             : `<b>${cov.scored}</b> calls scored on the current rubric.
                <b>${cov.awaiting_current_scoring||0}</b> recordings in this window are still awaiting it.`}
         </div>
         <div style="margin-top:10px">
           <button class="btn line sm" data-cmscope="all">Show the earlier history instead</button>
         </div>
       </div>`
    : `<div class="cm-banner warn">
         <h4>Showing every rubric version — scores are not comparable</h4>
         <div class="cm-note">
           These ${sum.calls} calls were scored under
           ${(CM.rubric_versions||[]).filter(v=>!v.is_current).length} different rubric versions with
           different scales. Patterns and rule counts are still meaningful; the average score and the
           trend line are not. ${(CM.rubric_versions||[]).map(v=>
             `<div style="margin-top:5px"><b>${esc(v.version)}</b>${v.is_current?" (current)":""} —
              ${v.calls} calls, average ${v.avg_score}</div>`).join("")}
         </div>
         <div style="margin-top:10px">
           <button class="btn gold sm" data-cmscope="current">Back to the current rubric only</button>
         </div>
       </div>`;

  const subs = [["patterns","What is happening"],["search","Search calls"]]
    .concat(cmFull() ? [["agents","By agent"],["coaching","Coaching"]] : [])
    .concat([["mapping","Rules and modules"]]);

  body.innerHTML = `
    ${banner}
    <div class="cm-ctl">
      <label for="cmDays">Period</label>
      <select id="cmDays">
        ${[[30,"Last 30 days"],[90,"Last 90 days"],[180,"Last 6 months"],[365,"Last 12 months"]]
          .map(([v,l])=>`<option value="${v}" ${cmDays===v?"selected":""}>${l}</option>`).join("")}
      </select>
      <span class="tsub">
        ${cov.first ? `${sdate(cov.first)} to ${sdate(cov.last)}` : "no scored calls in this period"}
      </span>
      ${!cmFull() ? `<span class="pill todo" title="Individual agent scores are not included in your view">Agency view</span>` : ""}
    </div>

    <div class="grid-stats">
      <div class="stat"><div class="k">Calls scored</div><div class="v">${sum.calls||0}</div></div>
      <div class="stat"><div class="k">Average score</div>
        <div class="v" style="color:${cmScoreColour(sum.avg_score)}">${sum.avg_score ?? "—"}</div></div>
      <div class="stat"><div class="k">Calls with a flag</div><div class="v">${sum.flagged_calls||0}</div></div>
      <div class="stat"><div class="k">Hard fails</div>
        <div class="v" style="${sum.hard_fail_calls?'color:var(--bad)':''}">${sum.hard_fail_calls||0}</div></div>
    </div>

    <div class="cm-sub">
      ${subs.map(([k,l])=>`<button class="${cmSub===k?"on":""}" data-cmsub="${k}">${l}</button>`).join("")}
    </div>
    <div id="cmBody"></div>`;

  body.querySelectorAll("[data-cmscope]").forEach(b=>b.addEventListener("click", async ()=>{
    cmScope = b.dataset.cmscope; selCallAgent = null;
    b.disabled = true; await loadCallMonitor(); mgrCall();
  }));
  body.querySelectorAll("[data-cmsub]").forEach(b=>b.addEventListener("click", async ()=>{
    cmSub = b.dataset.cmsub; selCallAgent = null;
    if(cmSub === "search" && !CMF){
      b.disabled = true;
      CMF = await rpc("training_call_facets",{p_code:CODE,p_scope:cmScope});
    }
    mgrCall();
  }));
  $("#cmDays").addEventListener("change", async e=>{
    cmDays = parseInt(e.target.value,10); selCallAgent = null;
    e.target.disabled = true; await loadCallMonitor(); mgrCall();
  });

  ({patterns:cmPatterns, search:cmSearch, agents:cmAgents,
    coaching:cmCoaching, mapping:cmMapping})[cmSub]();
}

/* ---- what is happening: the rules being broken, and where the training sits ---- */
function cmPatterns(){
  const rules = CM.by_rule||[], opps = CM.by_opportunity||[], locs = CM.by_location||[];
  const trend = CM.trend||[];
  const calls = (CM.summary||{}).calls||0;
  const box = $("#cmBody");

  if(!calls){
    box.innerHTML = `<div class="card"><div class="empty">
      No calls scored in this period. Nothing to show yet — the rule-to-module map under
      <b>Rules and modules</b> works regardless, and is worth a read now.</div></div>`;
    return;
  }

  const maxW = Math.max(1, ...trend.map(t=>t.calls));

  box.innerHTML = `
    <div class="section-h"><h2>Rules being broken</h2>
      <span class="note">Each one pointed at the module that teaches it</span></div>
    <div class="card" style="overflow-x:auto">
      <table><thead><tr>
        <th>What went wrong</th><th>Severity</th><th>Calls</th>
        ${cmFull()?"<th>People</th>":""}<th>Where it is taught</th>
      </tr></thead><tbody>
        ${rules.map(r=>`<tr>
          <td><div class="tname">${esc(r.label||r.rule_id)}</div>
              <div class="tsub"><span class="code">${esc(r.rule_id)}</span></div></td>
          <td><span class="sev ${esc(r.severity||"LOW")}">${esc(r.severity||"—")}</span></td>
          <td><b>${r.calls}</b><div class="tsub">${Math.round(r.calls*100/calls)}% of calls</div></td>
          ${cmFull()?`<td>${r.agents}</td>`:""}
          <td>${cmModuleCell(r)}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>

    <div class="section-h"><h2>Revenue left on the table</h2>
      <span class="note">Opportunities the evaluator heard and the agent did not take</span></div>
    <div class="card" style="overflow-x:auto">
      <table><thead><tr>
        <th>Opportunity</th><th>Came up</th><th>Missed</th><th>Taken</th><th>Where it is taught</th>
      </tr></thead><tbody>
        ${opps.map(o=>{
          const rate = o.present ? Math.round(o.missed*100/o.present) : 0;
          return `<tr>
            <td><div class="tname">${esc(o.label||o.opportunity_id)}</div>
                <div class="tsub"><span class="code">${esc(o.opportunity_id)}</span></div></td>
            <td>${o.present}</td>
            <td><b style="color:${rate>=75?"var(--bad)":rate>=50?"var(--warn)":"var(--ink)"}">${o.missed}</b>
                <div class="tsub">${rate}% missed</div></td>
            <td>${o.addressed}</td>
            <td>${cmModuleCell(o)}</td>
          </tr>`;}).join("") || `<tr><td colspan="5"><span class="tsub">No opportunities recorded in this period.</span></td></tr>`}
      </tbody></table>
    </div>

    <div class="cm-grid2" style="margin-top:26px">
      <div>
        <div class="section-h" style="margin-top:0"><h2>By office</h2></div>
        <div class="card" style="overflow-x:auto">
          <table><thead><tr><th>Office</th><th>Calls</th><th>Average</th><th>Hard fails</th></tr></thead>
          <tbody>${locs.map(l=>`<tr>
            <td><div class="tname">${esc(l.location)}</div>
                ${l.agents?`<div class="tsub">${l.agents} on the phones</div>`:""}</td>
            <td>${l.calls}</td>
            <td><b style="color:${cmScoreColour(l.avg_score)}">${l.avg_score ?? "—"}</b></td>
            <td>${l.hard_fails||0}</td></tr>`).join("")}</tbody></table>
        </div>
      </div>
      <div>
        <div class="section-h" style="margin-top:0"><h2>Volume by week</h2></div>
        <div class="card pad">
          <div class="spark">${trend.map(t=>
            `<i style="height:${Math.round(t.calls*100/maxW)}%" title="${t.week}: ${t.calls} calls, average ${t.avg_score}"></i>`).join("")}</div>
          <div class="tsub" style="margin-top:10px">
            ${trend.length ? `${sdate(trend[0].week)} to ${sdate(trend[trend.length-1].week)} · hover a bar for the week` : "—"}
          </div>
        </div>
      </div>
    </div>`;
}

/* ---- by agent: full access only ---- */
function cmAgents(){
  const box = $("#cmBody");
  const ags = CM.agents||[];
  const unmapped = CM.unmapped_names||[];

  if(!ags.length){
    box.innerHTML = `<div class="card"><div class="empty">No agent-attributed calls in this period.</div></div>`;
    return;
  }

  box.innerHTML = `
    <div class="cm-banner">
      <h4>How a call is attributed to a person</h4>
      <div class="cm-note">
        The phone system leaves <span class="code">agent_name</span> empty on every recording, so the
        person is taken from the caller name on outbound calls and the callee name on inbound ones.
        That identifies the <b>extension</b>, which is normally but not always the person who spoke —
        a shared desk or a covered phone will be credited to whoever the extension belongs to. Treat
        a single call as a prompt to listen, not as proof.
        ${unmapped.length?`<div style="margin-top:7px">Unrecognised names on recent calls:
          ${unmapped.map(n=>`<span class="code">${esc(n)}</span>`).join(" ")}</div>`:""}
      </div>
    </div>
    <div class="card" style="overflow-x:auto">
      <table><thead><tr>
        <th>Person</th><th>Office</th><th>Calls</th><th>Average</th><th>Flags</th>
        <th>Hard fails</th><th class="hide-sm">Last call</th><th>In the portal</th>
      </tr></thead><tbody>
        ${ags.map(a=>`<tr class="clk" data-cma="${esc(a.call_name)}">
          <td><div class="tname">${esc(a.display_name)}</div>
              ${a.open_coaching?`<div class="tsub"><b style="color:var(--warn)">${a.open_coaching} open coaching</b></div>`:""}</td>
          <td><span class="tsub">${esc(a.office||"Not on the agent roster")}</span></td>
          <td><b>${a.calls}</b></td>
          <td><b style="color:${cmScoreColour(a.avg_score)}">${a.avg_score ?? "—"}</b></td>
          <td>${a.flags||0}<div class="tsub">${a.calls?(a.flags/a.calls).toFixed(1):0} per call</div></td>
          <td>${a.hard_fails?`<b style="color:var(--bad)">${a.hard_fails}</b>`:"0"}</td>
          <td class="hide-sm"><span class="tsub">${when(a.last_call)}</span></td>
          <td>${a.enrolled?`<span class="pill done">Enrolled</span>`
                          :`<span class="pill todo">Not enrolled</span>`}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>
    <div id="cmDetail"></div>`;

  box.querySelectorAll("tr[data-cma]").forEach(r=>r.addEventListener("click", async ()=>{
    selCallAgent = r.dataset.cma;
    CMA = await rpc("training_call_agent_detail",
      {p_code:CODE,p_call_name:selCallAgent,p_days:cmDays,p_scope:cmScope,p_limit:40});
    renderCallAgent();
  }));
  if(selCallAgent && CMA) renderCallAgent();
}

  const a = CMA, box = $("#cmDetail");
  if(!a || !box) return;
  const s = a.summary||{};

  box.innerHTML = `
    <div class="section-h"><h2>${esc(a.display_name)}</h2>
      <button class="btn line sm" id="cmClose">Close</button></div>

    ${!a.enrolled ? `<div class="cm-banner warn">
        <h4>${esc(a.display_name)} is not enrolled in the portal</h4>
        <div class="cm-note">Their calls are being scored, but there is no training record to line up
          against and no way to assign a module. Add them under <b>Add an agent</b> and the two halves
          join up automatically.</div></div>` : ""}

    <div class="grid-stats">
      <div class="stat"><div class="k">Calls</div><div class="v">${s.calls||0}</div></div>
      <div class="stat"><div class="k">Average</div>

      <div class="stat"><div class="k">Best / worst</div><div class="v" style="font-size:20px">${s.best ?? "—"} / ${s.worst ?? "—"}</div></div>
      <div class="stat"><div class="k">Hard fails</div>
        <div class="v" style="${s.hard_fails?'color:var(--bad)':''}">${s.hard_fails||0}</div></div>
    </div>

    <div class="section-h"><h2>What they get flagged for</h2>
      <span class="note">With their progress on the module that covers it</span></div>
    <div class="card" style="overflow-x:auto">
      <table><thead><tr>
        <th>What went wrong</th><th>Severity</th><th>Calls</th><th>Module</th>
        <th>Their progress</th><th></th>
      </tr></thead><tbody>
        ${(a.by_rule||[]).map(r=>`<tr>
          <td><div class="tname">${esc(r.label||r.rule_id)}</div>
              <div class="tsub"><span class="code">${esc(r.rule_id)}</span></div></td>
          <td><span class="sev ${esc(r.severity||"LOW")}">${esc(r.severity||"—")}</span></td>
          <td><b>${r.calls}</b></td>
          <td>${cmModuleCell(r)}</td>
          <td>${r.their_progress ? statusPill(r.their_progress)
                : `<span class="tsub">${a.enrolled?"—":"not enrolled"}</span>`}</td>
          <td>${a.enrolled && r.module_slug
                ? (r.open_coaching
                    ? `<span class="pill prog">Coaching open</span>`
                    : `<button class="btn line sm" data-coach="${esc(r.module_slug)}"
                         data-rule="${esc(r.rule_id)}">Assign module</button>`)
                : ""}</td>
        </tr>`).join("") || `<tr><td colspan="6"><span class="tsub">No flags in this period.</span></td></tr>`}
      </tbody></table>
    </div>

    ${(a.missed_opportunities||[]).length ? `
      <div class="section-h"><h2>Opportunities they missed</h2></div>
      <div class="card" style="overflow-x:auto">
        <table><thead><tr><th>Opportunity</th><th>Missed</th><th>Module</th><th></th></tr></thead>
        <tbody>${a.missed_opportunities.map(o=>`<tr>
          <td><div class="tname">${esc(o.label||o.opportunity_id)}</div></td>
          <td><b>${o.missed}</b></td>
          <td>${cmModuleCell(o)}</td>
          <td>${a.enrolled && o.module_slug
                ? `<button class="btn line sm" data-coach="${esc(o.module_slug)}"
                     data-rule="${esc(o.opportunity_id)}">Assign module</button>` : ""}</td>
        </tr>`).join("")}</tbody></table>
      </div>` : ""}

    <div class="section-h"><h2>Recent calls</h2>
      <span class="note">Open one to read the transcript and the evidence behind each flag</span></div>
    <div class="card" style="overflow-x:auto">
      <table><thead><tr>
        <th>When</th><th>Type</th><th class="hide-sm">Length</th><th>Score</th><th>Flags</th>
      </tr></thead><tbody>
        ${(a.calls||[]).map(c=>`<tr class="clk" data-cmcall="${c.recording_id}">
          <td><div class="tname">${sdate(c.started_at)}</div>
              <div class="tsub">${new Date(c.started_at).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
                · ${esc(c.direction)}</div></td>
          <td><span class="tsub">${esc((c.call_type||"—").replace(/_/g," "))}${
                c.relationship?`<br>${esc(c.relationship.replace(/_/g," "))}`:""}</span></td>
          <td class="hide-sm"><span class="tsub">${Math.floor((c.duration_seconds||0)/60)}m ${(c.duration_seconds||0)%60}s</span></td>
          <td><b style="color:${cmScoreColour(c.score_total)}">${c.score_total ?? "—"}</b>
              ${c.hard_fail?`<div><span class="pill fail">Hard fail</span></div>`:""}
              ${c.rubric_version && CM.scope==="all"?`<div class="tsub">${esc(c.rubric_version)}</div>`:""}</td>
          <td>${(c.top_flags||[]).length
                ? `<div class="chips">${c.top_flags.slice(0,3).map(f=>
                     `<span class="chip">${esc(f)}</span>`).join("")}${
                     c.top_flags.length>3?`<span class="chip">+${c.top_flags.length-3}</span>`:""}</div>`
                : `<span class="pill done">Clean</span>`}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>`;

  $("#cmClose").addEventListener("click", ()=>{ selCallAgent=null; CMA=null; mgrCall(); });
  box.querySelectorAll("[data-coach]").forEach(b=>b.addEventListener("click", async e=>{
    e.stopPropagation();
    await cmAssign(b.dataset.coach, b.dataset.rule, null);
  }));
  box.querySelectorAll("tr[data-cmcall]").forEach(r=>r.addEventListener("click",
    ()=>openCallDetail(r.dataset.cmcall)));
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

async function cmAssign(moduleSlug, ruleId, recordingId){
  if(!selCallAgent) return;
  try{
    await rpc("training_call_coach",{p_code:CODE, p_call_name:selCallAgent,
      p_module_slug:moduleSlug, p_rule_id:ruleId||null,
      p_recording_id:recordingId||null, p_note:null});
    toast("Coaching item raised");
    CMA = await rpc("training_call_agent_detail",
      {p_code:CODE,p_call_name:selCallAgent,p_days:cmDays,p_scope:cmScope,p_limit:40});
    await loadCallMonitor();
    if($("#modal") && !$("#modal").classList.contains("hidden")) closeModal();
    mgrCall();
  }catch(ex){ toast(ex.message); }

        </div>

        <div class="card pad" style="margin-bottom:18px">
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <button class="btn gold sm" id="cmPlay">▶ Listen to this call</button>
            <span class="tsub" id="cmPlayNote">The recording opens for five minutes, then the link expires.</span>

          <div id="cmAudioWrap" style="margin-top:12px"></div>

        <h4 style="margin-bottom:9px">Flags — ${(d.flags||[]).length}</h4>
        ${(d.flags||[]).map(f=>`
          <div class="card pad" style="margin-bottom:11px">
            <div style="display:flex;gap:9px;align-items:baseline;flex-wrap:wrap">
              <span class="sev ${esc(f.severity||"LOW")}">${esc(f.severity||"—")}</span>

            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px">
              ${f.module_slug

                   ${d.can_coach && d.person_id

          <h4 style="margin:20px 0 9px">Evaluator notes</h4>

  // Audio is fetched only when asked for. The recordings bucket is private, so this
  // trades the access code for a signed URL that expires in five minutes — the page never
  // holds a durable link to a customer call.
  const play = $("#cmPlay");
  if(play) play.addEventListener("click", async ()=>{
    const wrap = $("#cmAudioWrap"), note = $("#cmPlayNote");
    play.disabled = true; play.textContent = "Fetching…";
    try{
      const r = await fetch(`${SUPABASE_URL}/functions/v1/portal-call-audio`, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "apikey":SUPABASE_KEY },
        body: JSON.stringify({ code: CODE, recording_id: recordingId })
      });
      const j = await r.json();
      if(!j.ok){
        note.textContent =
          j.error === "no_audio"       ? "No recording was stored for this call — older and very short calls often have none."
        : j.error === "NO_CALL_ACCESS" ? "Your code does not have call monitoring access."
        : j.error === "INVALID_CODE"   ? "That access code was not recognized."
        : "The recording could not be opened.";
        play.textContent = "▶ Listen to this call"; play.disabled = false;
        return;
      }
      // preload="auto", not "none": with "none" the element renders but never fetches, so
      // the player looks ready and does nothing until you press play a second time. The
      // fetch is already deliberate — you had to click Listen to get here.
      wrap.innerHTML = `<audio controls autoplay preload="auto" style="width:100%"
                          src="${esc(j.url)}"></audio>`;
      note.textContent = `Link expires in ${Math.round((j.expires_in||300)/60)} minutes — press the button again if it stops working.`;
      play.textContent = "▶ Reload the recording"; play.disabled = false;
    }catch(ex){
      note.textContent = "The recording could not be reached.";
      play.textContent = "▶ Listen to this call"; play.disabled = false;
    }
  });
}

/* ---- search and browse calls ----
   Option A of the two approaches discussed on 11 August 2026. The Call Monitoring
   project's own search is AI-driven and requires a logged-in Supabase Auth token, which
   the portal has no way to present — it authenticates by access code. So this is a
   deterministic search over the same tables: filters plus a keyword match on the
   transcript, gated by the same access code as everything else here.

   Available to anyone with call monitoring access, including aggregate. Braden's call,
   made knowingly: searching transcripts means reading them. What aggregate access still
   does not get is the per-agent scoreboard or the ability to assign coaching. */

function cmSearchMark(text, q){
  if(!text) return "";
  const safe = esc(text);
  if(!q) return safe;
  const needle = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(needle, "gi"), m=>`<mark>${m}</mark>`);
}
